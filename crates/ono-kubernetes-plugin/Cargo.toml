[package]
name = "ono-kubernetes-plugin"
description = "The KUANG/11 plugin binary: answers Ono-Sendai's provider queries from a Kubernetes cluster."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ono-kubernetes"
path = "src/main.rs"

[dependencies]
ono-provider-kubernetes = { path = "../ono-provider-kubernetes" }
ono-kuang-sdk = { workspace = true }
ono-value = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The deterministic test host of spec §31.73, and the supervisor types its host services are
# written against. Both come from the same git reference as the SDK, so a plugin is tested
# against exactly the host revision it is built against.
ono-kuang-testhost = { git = "https://github.com/godspeed-you/ono-sendai", rev = "5e49ee75cd32255ca9d16700ee1701d86e663f08" }
ono-kuang-supervisor = { git = "https://github.com/godspeed-you/ono-sendai", rev = "5e49ee75cd32255ca9d16700ee1701d86e663f08" }
async-trait = "0.1"
# The recorded cluster speaks TLS in one test, so the package's own `rustls` session has a real
# server on the other end of it rather than a fixture that replays a handshake.
rustls = { workspace = true }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
base64 = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true

# The distribution wrapper of K11A §8, §17, §22 (`ADR-0606 (core)`, ADR-0071 here): a `.deb` and an
# `.rpm` named `ono-plugin-kubernetes` that place the KUANG/11 payload — the manifest, the
# contributions, the runtime and the signature, unchanged — under the system source root as
# `<root>/<id>/<version>/`, beside a sidecar naming this outer package. Nothing else: no
# maintainer script, no activation, no trust, no permission. `scripts/package.sh` stages the
# payload under `target/payload/` (signing it when given a key) and drives both tools; the
# version directory is this crate's version, which `package/manifest.yaml` declares as well.
[package.metadata.deb]
name = "ono-plugin-kubernetes"
revision = ""
section = "admin"
priority = "optional"
depends = "ono (>= 0.4.4)"
extended-description = """\
The Kubernetes provider for Ono-Sendai, as a KUANG/11 plugin package. Installing this package
places the plugin payload under /usr/lib/ono-sendai/plugin-sources/ and nothing else: it is
not installed into Ono, trusted, permitted or activated until a user runs
`install plugin kubernetes` in ono and accepts the access it asks for."""
assets = [
    ["../../target/payload/io.github.godspeed-you.kubernetes/0.2.2/manifest.yaml", "usr/lib/ono-sendai/plugin-sources/io.github.godspeed-you.kubernetes/0.2.2/", "644"],
    ["../../target/payload/io.github.godspeed-you.kubernetes/0.2.2/contributions/*.yaml", "usr/lib/ono-sendai/plugin-sources/io.github.godspeed-you.kubernetes/0.2.2/contributions/", "644"],
    ["../../target/payload/io.github.godspeed-you.kubernetes/0.2.2/runtime/ono-kubernetes", "usr/lib/ono-sendai/plugin-sources/io.github.godspeed-you.kubernetes/0.2.2/runtime/", "755"],
    ["../../target/payload/io.github.godspeed-you.kubernetes/0.2.2/signature.*", "usr/lib/ono-sendai/plugin-sources/io.github.godspeed-you.kubernetes/0.2.2/", "644"],
    ["../../target/payload/io.github.godspeed-you.kubernetes/0.2.2.origin.yaml", "usr/lib/ono-sendai/plugin-sources/io.github.godspeed-you.kubernetes/", "644"],
    ["../../README.md", "usr/share/doc/ono-plugin-kubernetes/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "ono-plugin-kubernetes"
summary = "The Kubernetes provider for Ono-Sendai, as a KUANG/11 plugin package"
license = "Apache-2.0"
url = "https://github.com/godspeed-you/ono-sendai-kubernetes"
requires = { ono = ">= 0.4.4" }
assets = [
    { source = "../../target/payload/io.github.godspeed-you.kubernetes/0.2.2/manifest.yaml", dest = "/usr/lib/ono-sendai/plugin-sources/io.github.godspeed-you.kubernetes/0.2.2/manifest.yaml", mode = "644" },
    { source = "../../target/payload/io.github.godspeed-you.kubernetes/0.2.2/contributions/*.yaml", dest = "/usr/lib/ono-sendai/plugin-sources/io.github.godspeed-you.kubernetes/0.2.2/contributions/", mode = "644" },
    { source = "../../target/payload/io.github.godspeed-you.kubernetes/0.2.2/runtime/ono-kubernetes", dest = "/usr/lib/ono-sendai/plugin-sources/io.github.godspeed-you.kubernetes/0.2.2/runtime/ono-kubernetes", mode = "755" },
    { source = "../../target/payload/io.github.godspeed-you.kubernetes/0.2.2/signature.*", dest = "/usr/lib/ono-sendai/plugin-sources/io.github.godspeed-you.kubernetes/0.2.2/", mode = "644" },
    { source = "../../target/payload/io.github.godspeed-you.kubernetes/0.2.2.origin.yaml", dest = "/usr/lib/ono-sendai/plugin-sources/io.github.godspeed-you.kubernetes/0.2.2.origin.yaml", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/ono-plugin-kubernetes/LICENSE", mode = "644", doc = true },
    { source = "../../README.md", dest = "/usr/share/doc/ono-plugin-kubernetes/README.md", mode = "644", doc = true },
]
