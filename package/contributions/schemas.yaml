        nullable: true
        doc: '`metadata.labels`, whole. Null when the object carries none.'
      terminating:
        type: bool
        required: true
        doc: >-
          Whether deletion was accepted and has not completed — `metadata.deletionTimestamp` is
          present. A terminating object is still there and still answers (Gate H).
      phase:
        type: string
        nullable: true
        doc: '`status.phase` — `Available`, `Bound`, `Released` or `Failed`, verbatim.'
      capacity:
        type: string
        nullable: true
        doc: '`spec.capacity.storage`, as the quantity string the object states.'
      storage_class:
        type: string
        nullable: true
        doc: '`spec.storageClassName`.'
      volume_mode:
        type: string
        nullable: true
        doc: '`spec.volumeMode`.'
      access_modes:
        type: list<string>
        nullable: true
        doc: '`spec.accessModes`, whole.'
      reclaim_policy:
        type: string
        nullable: true
        doc: >-
          `spec.persistentVolumeReclaimPolicy` — `Retain`, `Delete` or `Recycle`. §30.5 requires
          this to be visible when planning a deletion, because deleting a Kubernetes object may
          destroy storage outside Kubernetes. `terminating` and `finalizers` are the other half of
          that question and are on every record here.
      claim:
        type: string
        nullable: true
        doc: >-
          The claim holding this volume, as `namespace/name` from `spec.claimRef` (§30.2). Null
          for an unbound volume.
      csi_driver:
        type: string
        nullable: true
        doc: >-
          `spec.csi.driver`, where the volume is provisioned through CSI (§30.4). Null for every
          other volume source. The driver name only — resolving it to a cloud disk is a cross-
          system resolver's work and not this provider's (§30.4, Gate K).
    default_view:
      columns: [name, phase, capacity, claim, storage_class, reclaim_policy]

  - id: io.github.godspeed-you.kubernetes.storageclass/1
    name: KubernetesStorageClass
    summary: >-
      A storage class: what provisions it, when it binds, and what happens on release.
    identity: [uid]
    fields:
      uid:
        type: string
        nullable: true
        doc: >-
          `metadata.uid` — the lifetime identity (§16.1). A name reused after deletion is a
          different StorageClass.
      name:
        type: string
        required: true
        doc: '`metadata.name`. A locator, never an identity (§16.2).'
      api_version:
        type: string
        required: true
        doc: '`apiVersion`, so the record carries the GVK it was read under (§13.1).'
      kind:
        type: string
        required: true
        doc: '`kind`. Group, version and kind together are object identity; they are not a GVR.'
      resource_version:
        type: string
        nullable: true
        doc: >-
          `metadata.resourceVersion`, as the opaque string the server sent (§14.3). Not a
          timestamp and never sorted as a timeline.
      created:
        type: timestamp
        nullable: true
        doc: '`metadata.creationTimestamp`. Null when the server sent none or it did not parse.'
      labels:
        type: map
        nullable: true
        doc: '`metadata.labels`, whole. Null when the object carries none.'
      terminating:
        type: bool
        required: true
        doc: >-
          Whether deletion was accepted and has not completed — `metadata.deletionTimestamp` is
          present. A terminating object is still there and still answers (Gate H).
      provisioner:
        type: string
        nullable: true
        doc: '`provisioner` — which driver creates volumes of this class.'
      reclaim_policy:
        type: string
        nullable: true
        doc: >-
          `reclaimPolicy` — what happens to a volume of this class when its claim goes away
          (§30.3, §30.5).
      volume_binding_mode:
        type: string
        nullable: true
        doc: >-
          `volumeBindingMode` — `Immediate` or `WaitForFirstConsumer`. It decides whether a claim
          can be Pending for a reason that is entirely correct.
      allow_volume_expansion:
        type: bool
        nullable: true
        doc: >-
          `allowVolumeExpansion` (§30.3). Null when the field is absent, never defaulted to false.
      is_default:
        type: bool
        nullable: true
        doc: >-
          Whether the cluster treats this as its default class, from the
          `storageclass.kubernetes.io/is-default-class` annotation — the only place Kubernetes
          states it. Null when the annotation is absent, because a class that has never carried it
          and one that carries `false` are the same state and neither is inferred from the other.
      parameters:
        type: map
        nullable: true
        doc: >-
          `parameters`, whole and uninterpreted. They are the driver's vocabulary rather than
          Kubernetes's, and this provider does not know what any given driver's keys mean.
    default_view:
      columns: [name, provisioner, reclaim_policy, volume_binding_mode, is_default]

  - id: io.github.godspeed-you.kubernetes.networkpolicy/1
    name: KubernetesNetworkPolicy
    summary: >-
      A network policy's intent, in the structure the API states it — never reduced to a verdict
      about reachability (§31.2, §31.3).
    identity: [uid]
    fields:
      uid:
        type: string
        nullable: true
        doc: >-
          `metadata.uid` — the lifetime identity (§16.1). A name reused after deletion is a
          different NetworkPolicy.
      name:
        type: string
        required: true
        doc: '`metadata.name`. A locator, never an identity (§16.2).'
      namespace:
        type: string
        nullable: true
        doc: '`metadata.namespace`.'
      api_version:
        type: string
        required: true
        doc: '`apiVersion`, so the record carries the GVK it was read under (§13.1).'
      kind:
        type: string
        required: true
        doc: '`kind`. Group, version and kind together are object identity; they are not a GVR.'
      resource_version:
        type: string
        nullable: true
        doc: >-
          `metadata.resourceVersion`, as the opaque string the server sent (§14.3). Not a
          timestamp and never sorted as a timeline.
      created:
        type: timestamp
        nullable: true
        doc: '`metadata.creationTimestamp`. Null when the server sent none or it did not parse.'
      labels:
        type: map
        nullable: true
        doc: '`metadata.labels`, whole. Null when the object carries none.'
      terminating:
        type: bool
        required: true
        doc: >-
          Whether deletion was accepted and has not completed — `metadata.deletionTimestamp` is
          present. A terminating object is still there and still answers (Gate H).
      pod_selector:
        type: map
        nullable: true
        doc: >-
          `spec.podSelector`, whole — which pods of this namespace the policy governs (§31.1). An
          empty selector selects every pod in the namespace, which is what the API means by it and
          is preserved rather than translated.
      policy_types:
        type: list<string>
        nullable: true
        doc: >-
          `spec.policyTypes` — `Ingress`, `Egress` or both. Null when the object states none, in
          which case Kubernetes infers them from which rule blocks are present, and this provider
          does not perform that inference on the server's behalf.
      rules:
        type: map
        nullable: true
        doc: >-
          `spec.ingress` and `spec.egress`, verbatim, under those two keys. **Not summarised, and
          deliberately so.** §31.2 forbids reducing a policy to a misleading boolean such as
          `internet_access = false`, because the peers combine namespace selectors, pod selectors
          and IP blocks and no summary of them is true without complete coverage of every policy
          that applies. And §31.3: the presence of this object is *intent*. Whether the installed
          network implementation enforces it is not observable from the API, so nothing here is
          named `enforced`.
    default_view:
      columns: [name, namespace, policy_types, pod_selector, created]

  - id: io.github.godspeed-you.kubernetes.resource/1
    name: KubernetesResource
    summary: Any resource the cluster serves, typed by the schema the cluster publishes for it.
    identity: [uid]
    fields:
      uid:
        type: string
        nullable: true
        doc: >-
          `metadata.uid` — the lifetime identity (§16.1). It is the identity of a custom
          resource for exactly the reason it is the identity of a Pod: the API server guarantees
          it and a name is a label a human reuses.
      name:
        type: string
        required: true
        doc: '`metadata.name`. A locator, never an identity (§16.2).'
      namespace:
        type: string
        nullable: true
        doc: >-
          `metadata.namespace`. Null for a cluster-scoped resource, which has no namespace
          rather than an empty one (§9.2) — `scope` below says which it is.
      api_version:
        type: string
        required: true
        doc: '`apiVersion`, as the object was read: `v1` for the core group, `group/version` otherwise.'
      kind:
        type: string
        required: true
        doc: >-
          `kind`, as the server spells it. With `api_group` this is the object identity §13.5
          requires, because kinds are not globally unique.
      resource_version:
        type: string
        nullable: true
        doc: '`metadata.resourceVersion`, opaque (§14.3).'
      created:
        type: timestamp
        nullable: true
        doc: '`metadata.creationTimestamp`.'
      labels:
        type: map
        nullable: true
        doc: '`metadata.labels`, whole. Null when the object carries none.'
      terminating:
        type: bool
        required: true
        doc: Whether deletion was accepted and has not completed (Gate H).
      api_group:
        type: string
        required: true
        doc: >-
          The API group, and the empty string for the core group (§13.3). Required and sometimes
          empty rather than nullable: the core group is a group whose name is empty, which is a
          known fact, and null would say nobody knows which group this is.
      resource_name:
        type: string
        required: true
        doc: >-
          The plural REST resource discovery named — a GVR's third part, never a kind (§13.1,
          §13.2). It is here because a query that started from a kind still has to be able to
          say which collection answered.
      scope:
        type: enum
        values: [namespaced, cluster]
        required: true
        doc: >-
          Whether objects of this resource live in a namespace, as the server declared it
          (§13.2). Discovered rather than inferred from whether this object happens to carry a
          namespace.
      schema_source:
        type: enum
        values: [openapi-v3, crd-structural, absent]
        required: true
        doc: >-
          Where the field descriptions came from (§12.1). `absent` means nothing described this
          resource — which is a statement about the server's documents and never a reason to
          withhold the object (§12.3, §15.5).
      precision:
        type: enum
        values: [structural, loose, unknown]
        required: true
        doc: >-
          How well the content below is known, as the weakest of its parts (§12.3): `structural`
          when a schema states every field's type, `loose` where a schema reaches a field and
          declines to describe it, `unknown` where none reaches it. Metadata is excluded, because
          this package projects metadata itself and a schema's silence about it leaves no gap.
      spec:
        type: map
        nullable: true
        doc: >-
          `spec`, whole: what someone asked for (§4 invariant 8). Null when the object carries
          none. Values are typed as far as the schema types them — a `date-time` format makes an
          instant, and its absence leaves the same field as the text the server sent.
      status:
        type: map
        nullable: true
        doc: >-
          `status`, whole: what a controller reported observing. Never merged with `spec`,
          because desired and observed state are different claims (§33.6, §37).
      other:
        type: map
        nullable: true
        doc: >-
          Every other top-level field — a ConfigMap's `data`, a Role's `rules` — so that a kind
          keeping its content outside `spec` keeps it here rather than losing it (§12.5, §4
          invariant 17). Null when the object has none. A Secret's payload is not among them: it
          was destroyed at the redaction boundary before this record existed (§22, ADR-0003).
      untyped:
        type: list<string>
        required: true
        doc: >-
          The JSON pointers of the content fields no schema described (§12.5). Those fields are
          present and valued in `spec`, `status` and `other` all the same — this list says which
          of them nothing vouches for, so that "shown" is never read as "understood". Empty
          rather than null when a schema described everything: that is a known answer.
    default_view:
      columns: [name, namespace, kind, api_group, precision, created]

  # One relationship, rather than one object. It is the only schema here whose identity is not a
  # `metadata.uid`, because an edge has none: it is derived from an object and, for the derived
  # classes, from a second reading. The four identity components are the object it starts at, the
  # relationship word, the far end's address and the field that decided — drop any one of them and
  # two edges that are not the same relationship become one record. ADR-0014.
  #
  # **Gate D (§62.4) is what this schema is for.** `evidence_class` is the six-way choice the gate
  # names, `evidence` is what was read and what it held, `evidence_path` is the pointer where the
  # class cites one, and `asserted` separates what the API server states from what this provider
  # derived (§23.3). An edge that lost any of those would be a relationship a user has to trust,
  # and §4 invariant 20 forbids a guess arriving in the shape of an assertion.
  - id: io.github.godspeed-you.kubernetes.relation/1
    name: KubernetesRelation
    summary: >-
      One relationship between two Kubernetes objects, and the evidence it rests on.
    identity: [uid, relation, target, evidence_path]
    fields:
      uid:
        type: string
        nullable: true
        doc: >-
          `metadata.uid` of the object the edge starts at (§16.1). The record is a fact *about*
          that object, so the field means here what it means in every other schema of this
          document. Two edges of one Pod share it, which is why it is not the whole identity.
      name:
        type: string
        required: true
        doc: '`metadata.name` of the object the edge starts at. A locator, never an identity (§16.2).'
      namespace:
        type: string
        nullable: true
        doc: >-
          `metadata.namespace` of the object the edge starts at. Null for a cluster-scoped object,
          which has no namespace rather than an empty one (§9.2).
      api_version:
        type: string
        required: true
        doc: '`apiVersion` of the object the edge starts at.'
      kind:
        type: string
        required: true
        doc: '`kind` of the object the edge starts at, as the server spells it.'
      source:
        type: string
        required: true
        doc: >-
          The near end as a place address (§35.3, §35.4): `k8s://<context>/ns/<namespace>/<kind>/
          <name>`, or `/cluster/<kind>/<name>` where the kind is cluster-scoped. The kind segment
          is lower-cased and carries its API group where it has one, because case is not
          recoverable from an address and the canonical spelling is discovery's answer (§13.2).
          Built by the place grammar rather than formatted, so a cluster-scoped object has no
          namespace slot to fill (ADR-0008).
      relation:
        type: string
        required: true
        doc: >-
          The relationship, in the word `follow` takes (§35.7) — `owned-by`, `controlled-by`,
          `scheduled-on`, `selects`, `routes-to`, `bound-to` and the rest. One vocabulary: a
          curated routing edge and an owner reference are the same kind of thing with different
          evidence behind them.
      target:
        type: string
        required: true
        doc: >-
          The far end as a place address, in the same grammar as `source` and in the same provider
          instance — relationships do not cross clusters (§9.6). Present even where the target was
          never read, because §24.1 keeps a dangling edge an edge.
      target_kind:
        type: string
        required: true
        doc: 'The kind the reference names. Half of a GVK, never a GVR (§13.1).'
      target_name:
        type: string
        required: true
        doc: 'The name the reference names. A locator, and for an unread target the only one.'
      target_namespace:
        type: string
        nullable: true
        doc: >-
          The namespace the far end is looked for in. Null is cluster scope and never "wherever
          the source lives": a namespace copied onto a cluster-scoped target would name an address
          that cannot be looked up (§9.2, §24.2).
      target_uid:
        type: string
        nullable: true
        doc: >-
          The far end's `metadata.uid` where the evidence carried one — an owner reference does,
          a `spec.nodeName` does not. This is what makes the far end provable rather than a name
          match (§16.1), and null is the honest answer where the reference states only a name.
      target_resolved:
        type: bool
        required: true
        doc: >-
          Whether the far-end object was actually read. False is not a broken edge: it is a
          relationship whose other end nobody has looked at, or cannot (§24.1). An identity is
          bound only where something resolved it, because inventing one would claim a lifetime
          nobody observed.
      target_roles:
        type: list<string>
        required: true
        doc: >-
          The far end's semantic roles (§36.2) — `workload`, `compute-node`, `configuration`,
          `secret`, `identity`, `storage`, `policy` and the rest. An overlay for cross-provider
          questions, beside the native kind rather than instead of it (§36.1): a Deployment is not
          an Auto Scaling Group because both can produce capacity (§36.3). Empty for a kind with
          no role, which is a statement rather than a gap.
      evidence_class:
        type: enum
        values: [native-field, owner-reference, selector, convention, adapter-derivation, inference]
        required: true
        doc: >-
          Which of §23's classes decided the edge, which is Gate D's first question (§62.4). The
          five classes above `inference` are produced; `inference` is declared and never emitted,
          because §23.5 forbids promoting name similarity or address matching to a verified
          relationship — and a reader must be able to tell one apart from the others by the
          record rather than by knowing which rule ran.
      evidence:
        type: string
        required: true
        doc: >-
          What was read and what it held, in one line: `/spec/nodeName = node-a`,
          `metadata.ownerReferences with controller: true`, `selector {app=api} matched labels
          {app=api}`. Gate D's second question, and the reason an edge is checkable rather than
          trusted.
      evidence_path:
        type: string
        nullable: true
        doc: >-
          The JSON pointer the evidence cites, where its class cites one. Null for the classes
          that rest on no single field — a selector evaluation read two objects, a convention read
          a label key, a derivation read whatever its rule says — because naming a pointer there
          would name a field as the proof when the proof is somewhere else.
      asserted:
        type: bool
        required: true
        doc: >-
          Whether the API server itself states this relationship, rather than this provider having
          derived it. True for a native field and an owner reference; false for a selector
          evaluation, because the server states a selector and it states some labels and it is
          *this provider* that evaluated one against the other (§23.3). §4 invariant 20 is why the
          difference is a field and not a footnote.
      supporting:
        type: list<string>
        required: true
        doc: >-
          What qualifies the edge without deciding it, each entry naming its own class: the host,
          path and port §27.1 requires to stay attached to a routing edge, the adapter and version
          that read a custom resource (§33.8), the owner-reference reversal behind an `owns` edge.
          None of it would make the edge exist and all of it changes what the edge means. Empty
          rather than null where there is none.
    default_view:
      columns: [name, relation, target_name, evidence_class, evidence, asserted]

  - id: io.github.godspeed-you.kubernetes.cluster/1
    name: KubernetesCluster
    summary: >-
      One provider instance: which cluster it reaches, whether it answers, and who it is to it.
    identity: [uid]
    fields:
      uid:
        type: string
        required: true
        doc: >-
          The provider instance — `kubernetes:<context>` (§6.2, §10.1). Not a `metadata.uid`:
          this record is not a Kubernetes object. It is the identity because it is what stays
          stable across reconnects and what two instances pointed at one cluster differ in.
          Keying on the cluster fingerprint instead would merge exactly the two instances §10.3
          says MUST NOT be merged.
      name:
        type: string
        required: true
        doc: 'The context this instance was configured from. A locator, never an identity (§16.2).'
      server:
        type: string
        nullable: true
        doc: >-
          The normalised API server origin — §10.2's first fingerprint signal, with the scheme's
          default port dropped so that two spellings of one address compare equal.
      reachable:
        type: bool
        required: true
        doc: >-
          Whether the API server answered anything at all. A `403` counts: a server that refuses
          is a server that is there, and the two have different fixes (§21.4).
      server_version:
        type: string
        nullable: true
        doc: >-
          `gitVersion` from `/version`, verbatim. Never interpreted: §5.3 forbids rejecting a
          cluster whose version string is unfamiliar. Null when `/version` did not answer, and
          `unknowns` then says why.
      tls:
        type: string
        required: true
        doc: >-
          What protects the session: `verified`, `insecure: certificate verification disabled`,
          or `none: plain HTTP/1.1`. §8.4 requires the active insecure state to be visible in
          provider diagnostics, so this is stated rather than inferred from the URL.
      fingerprint:
        type: string
        nullable: true
        doc: >-
          A non-secret digest over the fingerprint signals that were obtained (§10.2). Null when
          none were — a hash of nothing is a stable value every unidentifiable cluster would
          share. Two instances with the same fingerprint may be one cluster and are still two
          instances (§10.3).
      fingerprint_signals:
        type: list<string>
        required: true
        doc: >-
          Which of §10.2's signals the fingerprint above is composed of, so that one built from a
          single signal is visibly weaker than one built from three. Empty rather than null when
          nothing was obtainable: that is a known answer.
      kube_system_uid:
        type: string
        nullable: true
        doc: >-
          The `kube-system` namespace UID, the strongest identifier Kubernetes offers (§10.2).
          Null where the caller may not read it, and `unknowns` distinguishes a refusal from a
          namespace that is not there.
      server_key_fingerprint:
        type: string
        nullable: true
        doc: >-
          A SHA-256 over the server certificate's `SubjectPublicKeyInfo` (§10.2). The key rather
          than the certificate, so an ordinary renewal is not reported as a cluster replacement
          (§10.4). Null in this build, which does not surrender the verified certificate from its
          TLS session; `unknowns` records it as `not queried` rather than as absent.
      credential_identity:
        type: string
        nullable: true
        doc: >-
          The identity of the credential itself, before any impersonation (§8.5). Held apart from
          `effective_identity` even while nothing impersonates, so that the day one does, no
          reader of either field silently changes meaning.
      effective_identity:
        type: string
        nullable: true
        doc: >-
          The username the API server associates with this session's requests, from
          `SelfSubjectReview` (§8.6). Null where the cluster does not serve the review or refused
          it — which §8.6 requires never to block an ordinary read, so it is an unknown here and
          not an error.
      effective_uid:
        type: string
        nullable: true
        doc: 'The effective identity''s UID, where the authenticator provides one. Most do not.'
      effective_groups:
        type: list<string>
        nullable: true
        doc: >-
          The groups the API server resolved for this session. Null when the effective identity
          was not obtained; an empty list would claim membership of none.
      impersonating:
        type: bool
        required: true
        doc: >-
          Whether the session asks the API server to act as somebody else (§8.5). Always knowable
          locally, so never an unknown.
      impersonated_user:
        type: string
        nullable: true
        doc: 'The subject being impersonated, and null when none is (§8.5).'
      unknowns:
        type: list<string>
        required: true
        doc: >-
          Everything this diagnostic could not determine, each naming a subject and one of §21.4's
          outcomes — `read denied`, `not served`, `namespace absent`, `disconnected`,
          `not queried`. This is what makes a field the cluster refused distinguishable from one
          it does not have. Empty rather than null when everything was determined.
      probes:
        type: map
        required: true
        doc: >-
          Every request this diagnostic made, by source, with how it ended (§34.3). Per request
          rather than per cluster, so that an aggregated API server with its own availability is
          not reported as the cluster being unwell.
      latency_ms:
        type: map
        required: true
        doc: 'How long each request above took, in milliseconds (§34.3).'
    default_view:
      columns: [name, server, reachable, server_version, effective_identity, tls]
