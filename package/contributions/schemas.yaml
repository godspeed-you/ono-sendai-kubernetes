          rendered blob is a different thing from a map with a key in it.
      terminating:
        type: bool
        required: true
        doc: >-
          Whether deletion was accepted and has not completed — `metadata.deletionTimestamp` is
          present. A terminating object is still there and still answers (Gate H).
      finalizers:
        type: list<string>
        nullable: true
        doc: >-
          `metadata.finalizers` (§14.6) — what is holding a deletion open. An object that is
          `terminating` and lists finalizers is held by something namable rather than being
          slow, which is the half of Gate H a user could not see before. Null when the object
          states none.
      owner_references:
        type: list<map>
        nullable: true
        doc: >-
          `metadata.ownerReferences`, each whole: `api_version`, `kind`, `name`, `uid`,
          `controller` and `block_owner_deletion` (§14.6). A list of names would drop the two
          flags that make a reference more than a name. The same fact `k8s-relation` emits as
          `owned-by` and `controlled-by` edges, here as metadata of the object itself.
      field_managers:
        type: list<string>
        nullable: true
        doc: >-
          The distinct managers named in `metadata.managedFields`, sorted — §14.7's summary
          rather than the record itself, which is large and rarely what anyone wants. The
          structure stays reachable through `k8s-resource`, which projects the whole object.
      provisioner:
        type: string
        nullable: true
        doc: '`provisioner` — which driver creates volumes of this class.'
      reclaim_policy:
        type: string
        nullable: true
        doc: >-
          `reclaimPolicy` — what happens to a volume of this class when its claim goes away
          (§30.3, §30.5).
      volume_binding_mode:
        type: string
        nullable: true
        doc: >-
          `volumeBindingMode` — `Immediate` or `WaitForFirstConsumer`. It decides whether a claim
          can be Pending for a reason that is entirely correct.
      allow_volume_expansion:
        type: bool
        nullable: true
        doc: >-
          `allowVolumeExpansion` (§30.3). Null when the field is absent, never defaulted to false.
      is_default:
        type: bool
        nullable: true
        doc: >-
          Whether the cluster treats this as its default class, from the
          `storageclass.kubernetes.io/is-default-class` annotation — the only place Kubernetes
          states it. Null when the annotation is absent, because a class that has never carried it
          and one that carries `false` are the same state and neither is inferred from the other.
      parameters:
        type: map
        nullable: true
        doc: >-
          `parameters`, whole and uninterpreted. They are the driver's vocabulary rather than
          Kubernetes's, and this provider does not know what any given driver's keys mean.
    default_view:
      columns: [name, provisioner, reclaim_policy, volume_binding_mode, is_default]

  - id: io.github.godspeed-you.kubernetes.networkpolicy/1
    name: KubernetesNetworkPolicy
    summary: >-
      A network policy's intent, in the structure the API states it — never reduced to a verdict
      about reachability (§31.2, §31.3).
    identity: [uid]
    fields:
      uid:
        type: string
        nullable: true
        doc: >-
          `metadata.uid` — the lifetime identity (§16.1). A name reused after deletion is a
          different NetworkPolicy.
      name:
        type: string
        required: true
        doc: '`metadata.name`. A locator, never an identity (§16.2).'
      namespace:
        type: string
        nullable: true
        doc: '`metadata.namespace`.'
      api_version:
        type: string
        required: true
        doc: '`apiVersion`, so the record carries the GVK it was read under (§13.1).'
      kind:
        type: string
        required: true
        doc: '`kind`. Group, version and kind together are object identity; they are not a GVR.'
      resource_version:
        type: string
        nullable: true
        doc: >-
          `metadata.resourceVersion`, as the opaque string the server sent (§14.3). Not a
          timestamp and never sorted as a timeline.
      created:
        type: timestamp
        nullable: true
        doc: '`metadata.creationTimestamp`. Null when the server sent none or it did not parse.'
      labels:
        type: map
        nullable: true
        doc: '`metadata.labels`, whole. Null when the object carries none.'
      annotations:
        type: map
        nullable: true
        doc: >-
          `metadata.annotations`, whole and structured (§14.5). Null when the object carries
          none. Never flattened into one string: an annotation is read one key at a time, and a
          rendered blob is a different thing from a map with a key in it.
      terminating:
        type: bool
        required: true
        doc: >-
          Whether deletion was accepted and has not completed — `metadata.deletionTimestamp` is
          present. A terminating object is still there and still answers (Gate H).
      finalizers:
        type: list<string>
        nullable: true
        doc: >-
          `metadata.finalizers` (§14.6) — what is holding a deletion open. An object that is
          `terminating` and lists finalizers is held by something namable rather than being
          slow, which is the half of Gate H a user could not see before. Null when the object
          states none.
      owner_references:
        type: list<map>
        nullable: true
        doc: >-
          `metadata.ownerReferences`, each whole: `api_version`, `kind`, `name`, `uid`,
          `controller` and `block_owner_deletion` (§14.6). A list of names would drop the two
          flags that make a reference more than a name. The same fact `k8s-relation` emits as
          `owned-by` and `controlled-by` edges, here as metadata of the object itself.
      field_managers:
        type: list<string>
        nullable: true
        doc: >-
          The distinct managers named in `metadata.managedFields`, sorted — §14.7's summary
          rather than the record itself, which is large and rarely what anyone wants. The
          structure stays reachable through `k8s-resource`, which projects the whole object.
      pod_selector:
        type: map
        nullable: true
        doc: >-
          `spec.podSelector`, whole — which pods of this namespace the policy governs (§31.1). An
          empty selector selects every pod in the namespace, which is what the API means by it and
          is preserved rather than translated.
      policy_types:
        type: list<string>
        nullable: true
        doc: >-
          `spec.policyTypes` — `Ingress`, `Egress` or both. Null when the object states none, in
          which case Kubernetes infers them from which rule blocks are present, and this provider
          does not perform that inference on the server's behalf.
      rules:
        type: map
        nullable: true
        doc: >-
          `spec.ingress` and `spec.egress`, verbatim, under those two keys. **Not summarised, and
          deliberately so.** §31.2 forbids reducing a policy to a misleading boolean such as
          `internet_access = false`, because the peers combine namespace selectors, pod selectors
          and IP blocks and no summary of them is true without complete coverage of every policy
          that applies. And §31.3: the presence of this object is *intent*. Whether the installed
          network implementation enforces it is not observable from the API, so nothing here is
          named `enforced`.
    default_view:
      columns: [name, namespace, policy_types, pod_selector, created]

  - id: io.github.godspeed-you.kubernetes.resource/1
    name: KubernetesResource
    summary: Any resource the cluster serves, typed by the schema the cluster publishes for it.
    identity: [uid]
    fields:
      uid:
        type: string
        nullable: true
        doc: >-
          `metadata.uid` — the lifetime identity (§16.1). It is the identity of a custom
          resource for exactly the reason it is the identity of a Pod: the API server guarantees
          it and a name is a label a human reuses.
      name:
        type: string
        required: true
        doc: '`metadata.name`. A locator, never an identity (§16.2).'
      namespace:
        type: string
        nullable: true
        doc: >-
          `metadata.namespace`. Null for a cluster-scoped resource, which has no namespace
          rather than an empty one (§9.2) — `scope` below says which it is.
      api_version:
        type: string
        required: true
        doc: '`apiVersion`, as the object was read: `v1` for the core group, `group/version` otherwise.'
      kind:
        type: string
        required: true
        doc: >-
          `kind`, as the server spells it. With `api_group` this is the object identity §13.5
          requires, because kinds are not globally unique.
      resource_version:
        type: string
        nullable: true
        doc: '`metadata.resourceVersion`, opaque (§14.3).'
      created:
        type: timestamp
        nullable: true
        doc: '`metadata.creationTimestamp`.'
      labels:
        type: map
        nullable: true
        doc: '`metadata.labels`, whole. Null when the object carries none.'
      annotations:
        type: map
        nullable: true
        doc: >-
          `metadata.annotations`, whole and structured (§14.5). Null when the object carries
          none. Never flattened into one string: an annotation is read one key at a time, and a
          rendered blob is a different thing from a map with a key in it.
      terminating:
        type: bool
        required: true
        doc: Whether deletion was accepted and has not completed (Gate H).
      finalizers:
        type: list<string>
        nullable: true
        doc: >-
          `metadata.finalizers` (§14.6) — what is holding a deletion open. An object that is
          `terminating` and lists finalizers is held by something namable rather than being
          slow, which is the half of Gate H a user could not see before. Null when the object
          states none.
      owner_references:
        type: list<map>
        nullable: true
        doc: >-
          `metadata.ownerReferences`, each whole: `api_version`, `kind`, `name`, `uid`,
          `controller` and `block_owner_deletion` (§14.6). A list of names would drop the two
          flags that make a reference more than a name. The same fact `k8s-relation` emits as
          `owned-by` and `controlled-by` edges, here as metadata of the object itself.
      field_managers:
        type: list<string>
        nullable: true
        doc: >-
          The distinct managers named in `metadata.managedFields`, sorted — §14.7's summary
          rather than the record itself, which is large and rarely what anyone wants. The
          structure stays reachable through `k8s-resource`, which projects the whole object.
      api_group:
        type: string
        required: true
        doc: >-
          The API group, and the empty string for the core group (§13.3). Required and sometimes
          empty rather than nullable: the core group is a group whose name is empty, which is a
          known fact, and null would say nobody knows which group this is.
      resource_name:
        type: string
        required: true
        doc: >-
          The plural REST resource discovery named — a GVR's third part, never a kind (§13.1,
          §13.2). It is here because a query that started from a kind still has to be able to
          say which collection answered.
      scope:
        type: enum
        values: [namespaced, cluster]
        required: true
        doc: >-
          Whether objects of this resource live in a namespace, as the server declared it
          (§13.2). Discovered rather than inferred from whether this object happens to carry a
          namespace.
      schema_source:
        type: enum
        values: [openapi-v3, crd-structural, absent]
        required: true
        doc: >-
          Where the field descriptions came from (§12.1). `absent` means nothing described this
          resource — which is a statement about the server's documents and never a reason to
          withhold the object (§12.3, §15.5).
      precision:
        type: enum
        values: [structural, loose, unknown]
        required: true
        doc: >-
          How well the content below is known, as the weakest of its parts (§12.3): `structural`
          when a schema states every field's type, `loose` where a schema reaches a field and
          declines to describe it, `unknown` where none reaches it. Metadata is excluded, because
          this package projects metadata itself and a schema's silence about it leaves no gap.
      spec:
        type: map
        nullable: true
        doc: >-
          `spec`, whole: what someone asked for (§4 invariant 8). Null when the object carries
          none. Values are typed as far as the schema types them — a `date-time` format makes an
          instant, and its absence leaves the same field as the text the server sent.
      status:
        type: map
        nullable: true
        doc: >-
          `status`, whole: what a controller reported observing. Never merged with `spec`,
          because desired and observed state are different claims (§33.6, §37).
      other:
        type: map
        nullable: true
        doc: >-
          Every other top-level field — a ConfigMap's `data`, a Role's `rules` — so that a kind
          keeping its content outside `spec` keeps it here rather than losing it (§12.5, §4
          invariant 17). Null when the object has none. A Secret's payload is not among them: it
          was destroyed at the redaction boundary before this record existed (§22, ADR-0003).
      untyped:
        type: list<string>
        required: true
        doc: >-
          The JSON pointers of the content fields no schema described (§12.5). Those fields are
          present and valued in `spec`, `status` and `other` all the same — this list says which
          of them nothing vouches for, so that "shown" is never read as "understood". Empty
          rather than null when a schema described everything: that is a known answer.
    default_view:
      columns: [name, namespace, kind, api_group, precision, created]

  # One relationship, rather than one object. It is the only schema here whose identity is not a
  # `metadata.uid`, because an edge has none: it is derived from an object and, for the derived
  # classes, from a second reading. The four identity components are the object it starts at, the
  # relationship word, the far end's address and the field that decided — drop any one of them and
  # two edges that are not the same relationship become one record. ADR-0014.
  #
  # **Gate D (§62.4) is what this schema is for.** `evidence_class` is the six-way choice the gate
  # names, `evidence` is what was read and what it held, `evidence_path` is the pointer where the
  # class cites one, and `asserted` separates what the API server states from what this provider
  # derived (§23.3). An edge that lost any of those would be a relationship a user has to trust,
  # and §4 invariant 20 forbids a guess arriving in the shape of an assertion.
  - id: io.github.godspeed-you.kubernetes.relation/1
    name: KubernetesRelation
    summary: >-
      One relationship between two Kubernetes objects, and the evidence it rests on.
    identity: [uid, relation, target, evidence_path]
    fields:
      uid:
        type: string
        nullable: true
        doc: >-
          `metadata.uid` of the object the edge starts at (§16.1). The record is a fact *about*
          that object, so the field means here what it means in every other schema of this
          document. Two edges of one Pod share it, which is why it is not the whole identity.
      name:
        type: string
        required: true
        doc: '`metadata.name` of the object the edge starts at. A locator, never an identity (§16.2).'
      namespace:
        type: string
        nullable: true
        doc: >-
          `metadata.namespace` of the object the edge starts at. Null for a cluster-scoped object,
          which has no namespace rather than an empty one (§9.2).
      api_version:
        type: string
        required: true
        doc: '`apiVersion` of the object the edge starts at.'
      kind:
        type: string
        required: true
        doc: '`kind` of the object the edge starts at, as the server spells it.'
      source:
        type: string
        required: true
        doc: >-
          The near end as a place address (§35.3, §35.4): `k8s://<context>/ns/<namespace>/<kind>/
          <name>`, or `/cluster/<kind>/<name>` where the kind is cluster-scoped. The kind segment
          is lower-cased and carries its API group where it has one, because case is not
          recoverable from an address and the canonical spelling is discovery's answer (§13.2).
          Built by the place grammar rather than formatted, so a cluster-scoped object has no
          namespace slot to fill (ADR-0008).
      relation:
        type: string
        required: true
        doc: >-
          The relationship, in the word `follow` takes (§35.7) — `owned-by`, `controlled-by`,
          `scheduled-on`, `selects`, `routes-to`, `bound-to` and the rest. One vocabulary: a
          curated routing edge and an owner reference are the same kind of thing with different
          evidence behind them.
      target:
        type: string
        required: true
        doc: >-
          The far end as a place address, in the same grammar as `source` and in the same provider
          instance — relationships do not cross clusters (§9.6). Present even where the target was
          never read, because §24.1 keeps a dangling edge an edge.
      target_kind:
        type: string
        required: true
        doc: 'The kind the reference names. Half of a GVK, never a GVR (§13.1).'
      target_name:
        type: string
        required: true
        doc: 'The name the reference names. A locator, and for an unread target the only one.'
      target_namespace:
        type: string
        nullable: true
        doc: >-
          The namespace the far end is looked for in. Null is cluster scope and never "wherever
          the source lives": a namespace copied onto a cluster-scoped target would name an address
          that cannot be looked up (§9.2, §24.2).
      target_uid:
        type: string
        nullable: true
        doc: >-
          The far end's `metadata.uid` where the evidence carried one — an owner reference does,
          a `spec.nodeName` does not. This is what makes the far end provable rather than a name
          match (§16.1), and null is the honest answer where the reference states only a name.
      target_resolved:
        type: bool
        required: true
        doc: >-
          Whether the far-end object was actually read. False is not a broken edge: it is a
          relationship whose other end nobody has looked at, or cannot (§24.1). An identity is
          bound only where something resolved it, because inventing one would claim a lifetime
          nobody observed.
      target_roles:
        type: list<string>
        required: true
        doc: >-
          The far end's semantic roles (§36.2) — `workload`, `compute-node`, `configuration`,
          `secret`, `identity`, `storage`, `policy` and the rest. An overlay for cross-provider
          questions, beside the native kind rather than instead of it (§36.1): a Deployment is not
          an Auto Scaling Group because both can produce capacity (§36.3). Empty for a kind with
          no role, which is a statement rather than a gap.
      evidence_class:
        type: enum
        values: [native-field, owner-reference, selector, convention, adapter-derivation, inference]
        required: true
        doc: >-
          Which of §23's classes decided the edge, which is Gate D's first question (§62.4). The
          five classes above `inference` are produced; `inference` is declared and never emitted,
          because §23.5 forbids promoting name similarity or address matching to a verified
          relationship — and a reader must be able to tell one apart from the others by the
          record rather than by knowing which rule ran.
      evidence:
        type: string
        required: true
        doc: >-
          What was read and what it held, in one line: `/spec/nodeName = node-a`,
          `metadata.ownerReferences with controller: true`, `selector {app=api} matched labels
          {app=api}`. Gate D's second question, and the reason an edge is checkable rather than
          trusted.
      evidence_path:
        type: string
        nullable: true
        doc: >-
          The JSON pointer the evidence cites, where its class cites one. Null for the classes
          that rest on no single field — a selector evaluation read two objects, a convention read
          a label key, a derivation read whatever its rule says — because naming a pointer there
          would name a field as the proof when the proof is somewhere else.
      asserted:
        type: bool
        required: true
        doc: >-
          Whether the API server itself states this relationship, rather than this provider having
          derived it. True for a native field and an owner reference; false for a selector
          evaluation, because the server states a selector and it states some labels and it is
          *this provider* that evaluated one against the other (§23.3). §4 invariant 20 is why the
          difference is a field and not a footnote.
      supporting:
        type: list<string>
        required: true
        doc: >-
          What qualifies the edge without deciding it, each entry naming its own class: the host,
          path and port §27.1 requires to stay attached to a routing edge, the adapter and version
          that read a custom resource (§33.8), the owner-reference reversal behind an `owns` edge.
          None of it would make the edge exist and all of it changes what the edge means. Empty
          rather than null where there is none.
    default_view:
      columns: [name, relation, target_name, evidence_class, evidence, asserted]

  # One observed change, and one period that was not observed (§19, §39.3, §41.4, Gate F).
  #
  # The hard requirement of §19 is not that changes are delivered; it is that a *gap* in the
  # observation is impossible to miss. §4 invariant 14 forbids stitching pre-gap and post-gap
  # events into one history, and a stream of changes with nothing in it to mark the break would be
  # exactly that stitching. So `gap` is one of the five words `change` takes, and every record
  # carries the observation period it belongs to.
  - id: io.github.godspeed-you.kubernetes.change/1
    name: KubernetesChange
    summary: One observed change in a watched collection, or one period that was not observed at all.
    identity: [resource, segment, change, uid, resource_version]
    fields:
      change:
        type: enum
        values: [listed, added, modified, deleted, gap, notice]
        required: true
        doc: >-
          What this record reports. `listed` is an object that was in the collection when
          observation began — a starting state rather than a change (§19.1). `added`, `modified`
          and `deleted` are §19.3's classes verbatim. `gap` is a period this provider could not
          observe, which is a fact about time rather than about an object, and its object fields
          are therefore all null. `notice` reports that the *view* changed state while the cluster
          did not — a stream that started reconnecting, or one that has gone stale — and exists
          because §41.4 forbids a disconnected watch leaving a table that still looks live: a
          reader learns from arriving records, so a state nothing carries is a state nobody sees.
      resource:
        type: string
        required: true
        doc: >-
          The REST collection being observed, as `group/version/resource` — a GVR and never a
          GVK (§13.1).
      scope:
        type: string
        required: true
        doc: 'What was asked about: one namespace, every namespace, or cluster scope (§9.4).'
      segment:
        type: int
        required: true
        doc: >-
          Which unbroken period of observation this record belongs to, counting from one.
          Everything before a `410 Gone` is segment 1 and everything after it is segment 2, so
          two segments are two histories and the space between them is the gap (§19.4, §39.3).
      continuous:
        type: bool
        required: true
        doc: >-
          Whether observation has been unbroken from the acquisition to this record. The one-bit
          form of `segment`, for a reader who filters rather than groups. False from the first
          gap onward, and never reset.
      sync_state:
        type: string
        required: true
        doc: >-
          What the *connection* is doing — `syncing`, `live`, `reconnecting`, `gap detected` or
          `denied`. `live` is the only one of the five that entitles anybody to read an absence as
          an absence (§20.3).
      view_state:
        type: enum
        values: [syncing, live, reconnecting, "gap detected", stale, denied]
        required: true
        doc: >-
          What a reader is looking at (§41.4) — `sync_state`'s five words and one more. A stream
          that is `live` and has produced no observation for longer than `stale_after_ms` is
          `stale`: the connection is fine and what is on the screen may not be. The two fields can
          honestly disagree, which is why they are two.
      withheld:
        type: int
        required: true
        doc: >-
          How many objects of the collection the view is bounded out of holding (§18.5, §50.4).
          Zero when everything observed fits. A bound that is not reported is a truncation
          presented as a complete picture.
      uid:
        type: string
        nullable: true
        doc: >-
          The *object's* `metadata.uid`, which is what makes two observations about one lifetime
          (§16.1). Null for a gap. A change has no identity of its own.
      name:
        type: string
        nullable: true
        doc: '`metadata.name` of the object the change is about.'
      namespace:
        type: string
        nullable: true
        doc: '`metadata.namespace`, null for a cluster-scoped object and for a gap (§9.2).'
      api_version:
        type: string
        nullable: true
        doc: '`apiVersion` of the object.'
      kind:
        type: string
        nullable: true
        doc: '`kind` of the object.'
      resource_version:
        type: string
        nullable: true
        doc: >-
          `metadata.resourceVersion` of the object as this observation saw it, as the opaque
          string the server sent (§14.3). Never sorted as a timeline, and never compared across
          resources — it is what makes two observations of one object distinguishable and
          nothing more.
      created:
        type: timestamp
        nullable: true
        doc: '`metadata.creationTimestamp` of the object.'
      labels:
        type: map
        nullable: true
        doc: '`metadata.labels` of the object, whole.'
      terminating:
        type: bool
        nullable: true
        doc: >-
          Whether the object carries a deletion timestamp. Nullable here where every object
          schema makes it required, because a change record may be about no object at all.
      finalizers:
        type: list<string>
        nullable: true
        doc: >-
          `metadata.finalizers` (§14.6) — what a `deleted` event does *not* mean while any of
          them are still there.
      gap_reason:
        type: enum
        values: [watch_expired_410, watch_denied, restarted_without_checkpoint]
        nullable: true
        doc: >-
          Why continuity broke, in Appendix D.4's vocabulary. Null on every record but the one
          that reports a break.
      gap_detail:
        type: string
        nullable: true
        doc: >-
          The break with both of its edges — the last version observed before it and the version
          observation resumed at, once it did. A closed gap is still a gap: closing it says
          observation continues, never that the unobserved period was filled in (§19.4).
    default_view:
      columns: [change, segment, continuous, kind, name, resource_version, gap_reason]

  - id: io.github.godspeed-you.kubernetes.event/1
    name: KubernetesEvent
    summary: >-
      One Kubernetes Event: what a component reported, about what, and how many times the server
      recorded it.
    identity: [uid]
    fields:
      uid:
        type: string
        nullable: true
        doc: >-
          `metadata.uid` of the *Event object* (§16.1). An Event is a resource like any other, and
          this is its own lifetime identity rather than that of whatever it is about — which is
          `regarding_uid`, one field down.
      name:
        type: string
        required: true
        doc: >-
          `metadata.name` of the Event object, which the API server generates. A locator, never an
          identity (§16.2).
      namespace:
        type: string
        nullable: true
        doc: '`metadata.namespace`. Null only for an object the server sent without one (§9.2).'
      api_version:
        type: string
        required: true
        doc: '`apiVersion`.'
      kind:
        type: string
        required: true
        doc: '`kind`.'
      resource_version:
        type: string
        nullable: true
        doc: '`metadata.resourceVersion`, opaque (§14.3).'
      created:
        type: timestamp
        nullable: true
        doc: >-
          `metadata.creationTimestamp` of the Event object — when the API server accepted the
          record, not when the reporter observed what it describes. That is `event_time`, on a
          different clock (§39.1).
      labels:
        type: map
        nullable: true
        doc: '`metadata.labels`, whole — what a Service selector matches on.'
      annotations:
        type: map
        nullable: true
        doc: >-
          `metadata.annotations`, whole and structured (§14.5). Null when the object carries
          none. Never flattened into one string: an annotation is read one key at a time, and a
          rendered blob is a different thing from a map with a key in it.
      terminating:
        type: bool
        required: true
        doc: >-
          Whether deletion of the Event object was accepted and has not completed. Ordinary object
          metadata: an Event is a resource, and it is garbage-collected like one when its
          retention runs out (§38.1).
      finalizers:
        type: list<string>
        nullable: true
        doc: >-
          `metadata.finalizers` (§14.6) — what is holding a deletion open. An object that is
          `terminating` and lists finalizers is held by something namable rather than being
          slow, which is the half of Gate H a user could not see before. Null when the object
          states none.
      owner_references:
        type: list<map>
        nullable: true
        doc: >-
          `metadata.ownerReferences`, each whole: `api_version`, `kind`, `name`, `uid`,
          `controller` and `block_owner_deletion` (§14.6). A list of names would drop the two
          flags that make a reference more than a name. The same fact `k8s-relation` emits as
          `owned-by` and `controlled-by` edges, here as metadata of the object itself.
      field_managers:
        type: list<string>
        nullable: true
        doc: >-
          The distinct managers named in `metadata.managedFields`, sorted — §14.7's summary
          rather than the record itself, which is large and rarely what anyone wants. The
          structure stays reachable through `k8s-resource`, which projects the whole object.
      representation:
        type: enum
        values: [events.k8s.io, core]
        required: true
        doc: >-
          Which of §38.2's two representations this Event was read from — `events.k8s.io`, which
          §38.2 prefers, or the core group's, which a cluster inside the support window of §5.1
          may be the only thing serving. The newer group renamed almost every field, so a provider
          that knew one spelling would report a blank Event from half the clusters it can talk to.
      level:
        type: string
        required: true
        doc: >-
          The Event's `type`, as the API wrote it. `Normal` and `Warning` are documented upstream;
          anything else is preserved rather than folded into the routine one, and an Event with no
          `type` at all reads `unstated` — which is not the same as routine (§12.5).
      reason:
        type: string
        nullable: true
        doc: >-
          The machine-readable `reason`, carried as evidence and never as machine semantics.
          Upstream warns that reasons and messages evolve, so code that branches on one is an
          unversioned dependency that stops matching without failing — the branch simply stops
          being taken (§38.5). A curated adapter is where a stable meaning may be attached to one
          (§33.8).
      note:
        type: string
        nullable: true
        doc: >-
          The human-readable note — `note` in the newer representation, `message` in the core one.
          Evidence for a reader, on the same terms as `reason` (§38.5).
      action:
        type: string
        nullable: true
        doc: >-
          The action the reporter took or attempted, where it stated one.
      regarding:
        type: string
        nullable: true
        doc: >-
          What the Event is about, as a place address in the grammar `k8s-relation` uses (§35.4,
          ADR-0008). Null where the reference does not name something completely enough to look
          up: such an Event is still an observation and is still kept, because dropping it for
          being unattachable would delete evidence for tidiness (§38.3).
      regarding_kind:
        type: string
        nullable: true
        doc: >-
          The kind the Event's `regarding` — or the core representation's `involvedObject` —
          names. Half of a GVK, never a GVR (§13.1).
      regarding_name:
        type: string
        nullable: true
        doc: >-
          The name that reference carries. A locator, never an identity (§16.2).
      regarding_namespace:
        type: string
        nullable: true
        doc: >-
          The namespace that reference carries, and null for a cluster-scoped object, which has no
          namespace rather than an empty one (§9.2).
      regarding_uid:
        type: string
        nullable: true
        doc: >-
          The `metadata.uid` that reference carries, where the reporter wrote one. This is what
          attaches the Event to a *lifetime*: a Pod deleted and recreated under one name is two
          Pods, and the old one's Events are about decisions the new one never saw (§4 invariants
          4–5).
      related:
        type: string
        nullable: true
        doc: >-
          The secondary object the newer representation mentions, as `Kind/name`. Null in the core
          representation, which has no such field.
      reporting_controller:
        type: string
        nullable: true
        doc: >-
          The controller that reported it (§38.3). "The kubelet said it" and "the scheduler said
          it" are different claims about the same object, and an Event stripped of its reporter is
          an anonymous assertion.
      reporting_instance:
        type: string
        nullable: true
        doc: >-
          Which instance of that controller reported it. Beside the controller rather than folded
          into it, because one controller runs in several places and only one of them saw this.
      event_time:
        type: string
        nullable: true
        doc: >-
          When the reporter observed *this* occurrence, as the string the API carries.
          Deliberately not a timestamp: a timestamp field is one a shell sorts, and these come
          from the clocks of the components that reported them. An ordering assembled over them
          would read as a causal history while being an artefact of three unrelated accidents —
          those clocks, unordered delivery, and retention that has already discarded part of what
          happened (§38.1, §39.2).
      clock:
        type: string
        required: true
        doc: >-
          Which machine's clock wrote `event_time`: `reported-by/<controller>` where the Event
          names its reporter, and `unattributed` where it does not. Never this provider's clock,
          which never saw the occurrence. Two records whose clocks differ are not in any order at
          all (§39.2).
      aggregate:
        type: bool
        required: true
        doc: >-
          Whether this one record stands for more than one occurrence. True where the server
          recorded a count above one or a series. It is a flag rather than an invitation: there is
          no expansion here and none in the library, because Kubernetes aggregates precisely so
          that the individual occurrences need not be stored (§38.4).
      recorded_count:
        type: int
        nullable: true
        doc: >-
          How many occurrences the server recorded, from whichever of its two mechanisms recorded
          it. **One record carries this number; the occurrences are never expanded into records.**
          Forty-six of forty-seven aggregated failures were never observed individually, and
          manufacturing them would produce records a reader could not tell from observed ones
          (§38.4). Null where the server recorded no count.
      series_count:
        type: int
        nullable: true
        doc: >-
          The count of an ongoing series, where the Event is one. Held apart from `recorded_count`
          because the two upstream mechanisms mean different things — a total that has stopped
          moving, against a series still running — and collapsing them would lose which of the two
          this is (§38.4).
      series_last_observed:
        type: string
        nullable: true
        doc: >-
          When the series was last observed continuing, as the string the API carries. A string
          for the same reason `event_time` is one.
      first_seen:
        type: string
        nullable: true
        doc: >-
          The first occurrence the server timestamped, where it timestamped one. Never filled in
          from `eventTime`: that is when the reporter saw *this* occurrence, and copying it here
          to complete a rendering would state a beginning nobody recorded (§38.4).
      last_seen:
        type: string
        nullable: true
        doc: >-
          The last occurrence the server timestamped, where it timestamped one.
    default_view:
      columns: [level, reason, regarding_kind, regarding_name, recorded_count, reporting_controller, note]
  - id: io.github.godspeed-you.kubernetes.evidence/1
    name: KubernetesIdentityEvidence
    summary: >-
      One value a Node states about the machine underneath it, with where it was read and how far
      it goes — never a link to another system.
    identity: [uid, key, source]
    fields:
      uid:
        type: string
        nullable: true
        doc: >-
          `metadata.uid` of the Node this is evidence about (§16.1). The evidence attaches to a
          *lifetime*: a Node rebuilt under the same name is a different machine, and evidence that
          outlived the rebuild would point a resolver at hardware that is gone (§4 invariants
          4–5).
      name:
        type: string
        required: true
        doc: >-
          `metadata.name` of the Node. A locator, never an identity (§16.2).
      api_version:
        type: string
        required: true
        doc: >-
          `apiVersion` of the Node.
      kind:
        type: string
        required: true
        doc: >-
          `kind` of the Node, as the server spells it.
      subject:
        type: string
        required: true
        doc: >-
          The Node as a place address, in the grammar every other address in this document uses
          (§35.4, ADR-0008).
      key:
        type: string
        required: true
        doc: >-
          What kind of fact this is, under the key Appendix C.3 fixes — `kubernetes.node.provider-
          id`, `kubernetes.node.address`, `kubernetes.node.system-uuid`, `kubernetes.node.machine-
          id`, and the placement keys of §28.3. A spelling a resolver written against the document
          can look for.
      qualifier:
        type: string
        nullable: true
        doc: >-
          What narrows the key: the address type for an address (§28.5). Carried beside the value
          rather than folded into it, because a resolver matching an internal address against a
          public inventory is precisely the mistake the type information prevents. Null where the
          key already says everything.
      value:
        type: string
        nullable: true
        doc: >-
          The value, exactly as the field held it. Null for a key that was not read, where
          `observed` is false and `outcome` says why.
      source:
        type: string
        nullable: true
        doc: >-
          The JSON pointer this was read from, resolvable against the Node it came from — a
          citation a reader can check rather than a field name they have to trust (§47.7). Null
          for a key that was not read.
      strength:
        type: enum
        values: [distinguishing, correlating, placement]
        nullable: true
        doc: >-
          How far this value narrows the subject down, in §47.2's ranking. `distinguishing` is a
          field whose purpose is to name one thing in the system that assigned it; `correlating`
          is a value equal across unrelated things, reassigned while the thing lives, or copied
          when a machine is cloned; `placement` is a property of where the subject sits rather
          than of which thing it is, and a thousand machines share a zone (§28.3, §28.5). Null for
          a key that was not read: strength is how far a *value* goes, and there is no value.
      evidence_class:
        type: enum
        values: [native-field, owner-reference, selector, convention, adapter-derivation, inference]
        nullable: true
        doc: >-
          What class of thing this rests on, in the vocabulary §23 already defines rather than a
          second one — a field the server states, or a naming convention somebody with write
          access can change. Deliberately never `inference`: an inference wearing this provider's
          authority is what §4 invariant 20 forbids.
      evidence:
        type: string
        nullable: true
        doc: >-
          What was read and what it held, in the same rendering an edge's evidence carries
          (ADR-0013).
      asserted:
        type: bool
        nullable: true
        doc: >-
          Whether the API server states this or a convention supplies it (§23.3). A well-known
          label is written by a controller and anyone with write access can change it, which is
          weaker than a field the server owns and must render as weaker.
      lookup_key:
        type: bool
        nullable: true
        doc: >-
          Whether a resolver that has read another system may key a lookup on this value **alone**
          (§47.2). False for every address and every copied host identifier: private ranges repeat
          between clusters, a public address outlives the machine that held it, a hostname is
          assigned rather than owned, and an identifier baked into a disk image is shared by every
          machine built from it (§28.5). Note what neither answer says — that a match *is* a
          verified link. Matching happens against a system this provider has not read, and there
          is no field on this record for the result (§47.1).
      uri_scheme:
        type: string
        nullable: true
        doc: >-
          The scheme of a URI-shaped identifier, where the identifier is one. This and `uri_path`
          are the whole decomposition §28.4 permits: this provider knows that `://` separates a
          scheme from a path and that `/` separates path segments, and it labels no segment. A
          resolver that has read the other system knows what the segments mean, and that is where
          the knowledge belongs (§47.1, Gate K).
      uri_path:
        type: string
        nullable: true
        doc: >-
          The path under the scheme, undivided and unlabelled. Null for every key that is not a
          URI-shaped identifier.
      observed:
        type: bool
        required: true
        doc: >-
          Whether this record is a value the Node stated or a key that could not be read. False
          makes `value`, `source`, `strength` and the rest null and fills `outcome` — because a
          rendering that dropped the unread keys would read as "this Node has no cross-system
          identity" when it means "nobody asked" (§4 invariant 13, §47.7).
      outcome:
        type: string
        nullable: true
        doc: >-
          Why the key is not here, in §21.4's vocabulary: `absent` where the stanza came back
          without the field, `not queried` where nobody projected the stanza at all. Null where
          the value was observed.
    default_view:
      columns: [name, key, qualifier, value, strength, lookup_key, source, observed, outcome]
  - id: io.github.godspeed-you.kubernetes.log/1
    name: KubernetesLogLine
    summary: >-
      One line of a container's log, with everything that kept the read short of what the
      container wrote.
    identity: [uid, container, instance, line]
    fields:
      uid:
        type: string
        nullable: true
        doc: >-
          `metadata.uid` of the Pod the log was read from (§16.1). A Pod deleted and recreated
          under one name is two containers, and their outputs are not one log (§4 invariants 4–5).
      name:
        type: string
        required: true
        doc: >-
          `metadata.name` of the Pod. A locator, never an identity (§16.2).
      namespace:
        type: string
        nullable: true
        doc: >-
          `metadata.namespace` of the Pod. A Pod name is unique within a namespace of one cluster
          and nowhere else, and a line attributed to the identically named Pod elsewhere is the
          most expensive kind of wrong (§42.1).
      api_version:
        type: string
        required: true
        doc: >-
          `apiVersion` of the Pod.
      kind:
        type: string
        required: true
        doc: >-
          `kind` of the Pod, as the server spells it.
      container:
        type: string
        nullable: true
        doc: >-
          Which container, where the query named one. Null where it did not and the API server
          chose — a Pod with one container, in practice (§42.1).
      instance:
        type: enum
        values: [current, previous]
        required: true
        doc: >-
          Which run of the container this is: the one running now, or the one prior run the
          kubelet still retains. Two values and no third, because `previous` reaches exactly that
          one run and an ordinal selector would name runs the cluster cannot produce (§42.1).
      line:
        type: int
        required: true
        doc: >-
          Which line of *this read* it is, counting from one. Not a line number in the container's
          output: what came before the first line here was cut off by `bounds`, and numbering from
          the container's own beginning would claim a beginning nobody read.
      text:
        type: string
        nullable: true
        doc: >-
          The line as text, where its bytes are UTF-8. Null where they are not, and
          `not_utf8_after` then says how far decoding got. Never a lossy conversion: substituting
          U+FFFD hands back something that reads like the container's output and is not it, with
          nothing downstream able to tell that a substitution happened (§12.5).
      bytes:
        type: int
        required: true
        doc: >-
          How many bytes the container wrote on this line, without the newline and without any
          timestamp prefix. Known whether or not the bytes are text.
      not_utf8_after:
        type: int
        nullable: true
        doc: >-
          How many leading bytes of the line were valid UTF-8, where the line is not text. Null
          where it is.
      stamp:
        type: string
        nullable: true
        doc: >-
          The timestamp the API server prefixed, where `timestamps` was asked for. Kept as the
          string it arrived as and deliberately not parsed: it is the container runtime's clock,
          on the node, and comparing it with this provider's observations or with another node's
          would be the cross-clock timeline §39.2 forbids.
      clock:
        type: string
        required: true
        doc: >-
          Which machine's clock wrote `stamp`: `node/<name>` where the Pod states the node it runs
          on, `unattributed` where it does not. The prefix is written on the node rather than by
          the API server, and a reader who does not know that will compare it with something it is
          not comparable with (§39.1, §42.1).
      terminated:
        type: bool
        required: true
        doc: >-
          Whether the server sent the newline that ends this line. False for the remainder of a
          body that stopped mid-line — presenting that remainder as a line would show half a
          message as one the container finished writing.
      bounds:
        type: list<string>
        required: true
        doc: >-
          Everything that kept this read short of what the container wrote. **Never empty.** `the
          container runtime rotated and truncated this log before it was read` is in every list,
          because rotation and truncation happened in the runtime before anybody asked;
          `tailLines`, `sinceSeconds` and `limitBytes` each add their own entry where the query
          set one. A log is not the container's complete output, and a record that omitted this
          would imply completeness by saying nothing (§42.1).
      ending:
        type: string
        required: true
        doc: >-
          Why the lines stopped: the response body ended, the read was cancelled, or the stream
          failed. A body that ended is a statement about the response and not about the container.
      may_contain_secrets:
        type: bool
        required: true
        doc: >-
          Whether the shell must treat these bytes as possibly secret. Always true, and not a scan
          of the content: whether a log carries a credential is not decidable from the log — the
          secret may be base64, a fragment across two lines, or a URL with a token in its query —
          and a field that sometimes answered false would be a filter that is wrong exactly when
          it matters (§42.2).
    default_view:
      columns: [line, stamp, text, container, instance, bounds]
  - id: io.github.godspeed-you.kubernetes.timeline/1
    name: KubernetesObservation
    summary: >-
      One thing known to have a time attached, the clock that wrote it, and the window this
      provider was observing in.
    identity: [uid, source, clock, stamp, detail]
    fields:
      uid:
        type: string
        nullable: true
        doc: >-
          `metadata.uid` of the object the observation is about (§16.1).
      name:
        type: string
        required: true
        doc: >-
          `metadata.name` of that object. A locator, never an identity (§16.2).
      namespace:
        type: string
        nullable: true
        doc: >-
          `metadata.namespace` of that object, and null for a cluster-scoped one (§9.2).
      api_version:
        type: string
        required: true
        doc: >-
          `apiVersion` of that object.
      kind:
        type: string
        required: true
        doc: >-
          `kind` of that object, as the server spells it.
      basis:
        type: enum
        values: [observed, reported]
        required: true
        doc: >-
          Whether this provider *saw* the change happen or *read* a timestamp off state (§39.2).
          Only a watch event within an unbroken observation period is `observed`; everything a
          read produces is `reported`. This is the distinction that stops a provider manufacturing
          history: a Pod created at 08:00 and first read at 14:00 is a reported creation timestamp
          and not six hours of observation.
      source:
        type: enum
        values: [watch-event, resource-snapshot, event-record, object-metadata, condition-transition, managed-field]
        required: true
        doc: >-
          Where the observation came from, in §39.1's list: a watch event, a list or get that
          captured state at a moment, a Kubernetes Event, object metadata, a condition transition,
          or a `managedFields` entry. `watch-event` is the only one whose basis is `observed`.
      clock:
        type: string
        required: true
        doc: >-
          Which machine's clock wrote `stamp`: `provider` for this machine's own acquisition time,
          `api-server`, `reported-by/<controller>`, `node/<name>`, or `unattributed` where the
          object does not say. Two stamps are comparable only when the same clock wrote both, and
          `unattributed` is not comparable even with itself — some controller wrote it and the
          object does not record which (§37.1, §39.2).
      stamp:
        type: string
        required: true
        doc: >-
          The time, as the string the clock wrote it in. Deliberately not a timestamp: a timestamp
          field is one a shell sorts into a single column, and parsing five machines' clocks into
          one produces something that reads as a history of the cluster while being a picture of
          the skew between those machines (§39.2). The only ordering this provider offers is per
          clock, and it is reached by naming one.
      placeable:
        type: bool
        required: true
        doc: >-
          Whether `stamp` reads as an instant on its clock at all. False where the value did not
          parse, which is an answer — the observation still happened, and its time is unusable. An
          unplaceable stamp is kept rather than dropped for tidiness, because discarding it would
          lose both facts.
      detail:
        type: string
        required: true
        doc: >-
          What was observed, in words: `created`, `deletion accepted`, a condition and its status,
          the manager that applied a field set, or the Event's own one-line rendering.
      window_opened:
        type: timestamp
        required: true
        doc: >-
          When this provider started observing, on its own clock — the only clock this machine
          owns. A window opens when observation starts and never earlier, so an object created
          last year and first read a moment ago has a window a moment wide (§39.2).
      window_latest:
        type: timestamp
        required: true
        doc: >-
          The latest moment observation is known to have reached, on the same clock. Monotonic: a
          clock that answers an earlier instant does not shorten a window whose observations were
          still made.
      continuous:
        type: bool
        required: true
        doc: >-
          Whether one unbroken stretch covers the window. False as soon as anything could not be
          observed, and the reason is in `gaps`.
      gaps:
        type: list<string>
        required: true
        doc: >-
          The stretches of time this provider could not observe, each naming the continuity token
          it starts after, why observation stopped, and what is known about its length (§19.4,
          §39.3). A duration comes from the provider's clock at both ends or from nowhere:
          subtracting two `resourceVersion`s would be arithmetic on opaque strings (§14.3, §4
          invariant 6). Empty where nothing broke — which is a statement, not a gap.
      not_observed:
        type: list<string>
        required: true
        doc: >-
          The other kind of hole: scopes that were never readable, each naming a scope and one of
          §21.4's outcomes. A namespace whose Events are denied is not a namespace in which
          nothing was reported, and a continuous window over a denied scope is not a complete
          answer. Empty where everything asked about answered.
    default_view:
      columns: [basis, source, clock, stamp, detail, continuous, gaps]
  - id: io.github.godspeed-you.kubernetes.why/1
    name: KubernetesFinding
    summary: >-
      One thing this provider is prepared to say about the state an object is in, and the rung
      above which it will not climb.
    identity: [uid, claim, support]
    fields:
      uid:
        type: string
        nullable: true
        doc: >-
          `metadata.uid` of the object the finding is about (§16.1).
      name:
        type: string
        required: true
        doc: >-
          `metadata.name` of that object. A locator, never an identity (§16.2).
      namespace:
        type: string
        nullable: true
        doc: >-
          `metadata.namespace` of that object, and null for a cluster-scoped one (§9.2).
      api_version:
        type: string
        required: true
        doc: >-
          `apiVersion` of that object.
      kind:
        type: string
        required: true
        doc: >-
          `kind` of that object, as the server spells it.
      claim:
        type: enum
        values: [CAUSALITY_NOT_PROVEN, CORRELATED_WITH, PRECEDED_BY, DEPENDENCY_PATH_EXISTS, ASSERTED_BY_KUBERNETES]
        required: true
        doc: >-
          The strongest thing this provider is prepared to say about this link, in the five words
          of §40's ladder and §11.3 of the Cloud-Native Vision. `CAUSALITY_NOT_PROVEN` — nothing
          sufficient was found. `CORRELATED_WITH` — two observations on one clock, close together.
          `PRECEDED_BY` — two observations on one clock, in an order. `DEPENDENCY_PATH_EXISTS` — a
          relationship path connects them, so influence was possible. `ASSERTED_BY_KUBERNETES` —
          the API server states the link itself (§23.4). **There is no sixth**, and its absence is
          what makes every refusal here structural rather than a matter of who reviews the change.
      claim_means:
        type: string
        required: true
        doc: >-
          What the claim licenses a reader to conclude, and where it stops — written into the
          vocabulary rather than left to a renderer, because a token on its own is read as
          strongly as its reader needs it to be. `CORRELATED_WITH` arrives with "one clock saw
          both, close together; proximity is not a causal link".
      support_class:
        type: enum
        values: [sequence, path, assertion, nothing]
        required: true
        doc: >-
          Which of the four shapes the support takes: two observations one clock put a distance
          between, a path of relationship edges, something the API server states, or nothing. A
          word of its own rather than something a reader infers from which fields are null,
          because "no support" and "support this build did not render" would otherwise look the
          same.
      support:
        type: string
        required: true
        doc: >-
          What was actually read to make the claim. A claim without its support is an opinion, and
          Gate D's rule for relationships applies here for the same reason: an answer a user
          cannot check is one they have to trust.
      not_proven:
        type: string
        nullable: true
        doc: >-
          Why a finding established nothing, where it established nothing: different clocks wrote
          the two timestamps, a timestamp could not be read, the two are further apart than the
          window asked about, they are not in that order, no relationship path connects them,
          Kubernetes states no such link, or nothing was gathered. A refusal that names its reason
          is actionable where a bare "unknown" sends the reader back to guessing (§40.5). Null
          where the finding established something.
      clock:
        type: string
        nullable: true
        doc: >-
          The clock that wrote both timestamps, where the support is a distance. A distance needs
          one clock, so this is never two: a `creationTimestamp` against this machine's
          acquisition time yields `different clocks wrote the two timestamps` rather than a number
          (§39.2). Null for every other kind of support.
      apart_ms:
        type: int
        nullable: true
        doc: >-
          How far apart that one clock put the two observations, in milliseconds. Null for every
          other kind of support, and null wherever no distance exists.
      evidence_class:
        type: enum
        values: [native-field, owner-reference, selector, convention, adapter-derivation, inference]
        nullable: true
        doc: >-
          The evidence class of what Kubernetes states, where the support is an assertion — the
          same six-way vocabulary every relationship edge carries (§23, ADR-0013). Null for every
          other kind of support.
      evidence_path:
        type: string
        nullable: true
        doc: >-
          The JSON pointer the assertion rests on, where its class cites one. Null otherwise.
      strongest_claim:
        type: enum
        values: [CAUSALITY_NOT_PROVEN, CORRELATED_WITH, PRECEDED_BY, DEPENDENCY_PATH_EXISTS, ASSERTED_BY_KUBERNETES]
        required: true
        doc: >-
          The strongest claim any finding in this answer makes, carried on **every** record rather
          than on a summary somebody may not read. It is the maximum of the ladder and never a
          summation: three weak findings do not add up to a strong one, and a scoring function is
          how they would.
      insufficient_evidence:
        type: bool
        required: true
        doc: >-
          Whether §40.5's required conclusion is the honest one — true where nothing rose above
          `CAUSALITY_NOT_PROVEN`. The specification calls this preferable to a plausible invented
          explanation, and it is cheap to reach on purpose.
      not_observed:
        type: list<string>
        required: true
        doc: >-
          What the search could not reach, each entry naming a scope and one of §21.4's outcomes.
          "Nothing was found" over a denied namespace and "nothing was found" over a complete read
          are different answers. Empty where everything asked about answered.
    default_view:
      columns: [claim, support, not_proven, strongest_claim, insufficient_evidence]
  - id: io.github.godspeed-you.kubernetes.condition/1
    name: KubernetesCondition
    summary: >-
      One condition a controller wrote about an object, kept structured rather than reduced to a
      status word.
    identity: [uid, condition_type]
    fields:
      uid:
        type: string
        nullable: true
        doc: >-
          `metadata.uid` of the object the condition is about (§16.1).
      name:
        type: string
        required: true
        doc: >-
          `metadata.name` of that object. A locator, never an identity (§16.2).
      namespace:
        type: string
        nullable: true
        doc: >-
          `metadata.namespace` of that object, and null for a cluster-scoped one (§9.2).
      api_version:
        type: string
        required: true
        doc: >-
          `apiVersion` of that object.
      kind:
        type: string
        required: true
        doc: >-
          `kind` of that object, as the server spells it.
      condition_type:
        type: string
        required: true
        doc: >-
          The condition's `type`, which is the kind's own vocabulary (§37.2). Spelled
          `condition_type` rather than `type` because `kind` and `api_version` on this record
          already mean the Kubernetes type, and one field name means one thing across this
          document (ADR-0013).
      status:
        type: string
        required: true
        doc: >-
          The condition's `status`, as the string the API carries. `True`, `False` and `Unknown`
          are three states and a boolean has two — and a controller may write a fourth word this
          provider has never seen, which §37.2 requires to survive rather than be coerced into
          `false`. `Unknown` is a controller saying it does not know, which is not the same as
          `False` (§37.1).
      reason:
        type: string
        nullable: true
        doc: >-
          The machine-readable `reason`, where the controller gave one.
      message:
        type: string
        nullable: true
        doc: >-
          The human-readable `message`, where the controller gave one. Both are kept because
          reducing a condition to a green word throws away the only parts an operator can act on
          (§4 invariant 9).
      observed_generation:
        type: int
        nullable: true
        doc: >-
          The generation this observation was written about (§37.3). Absent rather than zero when
          the controller wrote none: a defaulted `0` would read as "observed generation 0", a
          claim the object never made. **On its own this is never a claim of health.** It is
          evidence that a controller saw a desired state and nothing more; what convergence would
          mean is in `reconciliation`, with the rule that derived it.
      generation:
        type: int
        nullable: true
        doc: >-
          `metadata.generation` of the object, beside `observed_generation` so that the distance
          between what was asked and what a controller has seen is readable without a second
          query. `generation` moved because the API server accepted a write; `observedGeneration`
          moved because a controller read it; neither says the workload runs (§20.4).
      last_transition_time:
        type: string
        nullable: true
        doc: >-
          When the status last changed, as the string the server sent. Deliberately not a
          timestamp: `status.conditions` does not say which controller wrote the entry, so two
          conditions on one object may be two machines' idea of the time and must not be sorted
          against each other (§37.1, §39.2).
      clock:
        type: string
        required: true
        doc: >-
          Which machine's clock wrote `last_transition_time`. Always `unattributed`, because the
          API does not record which controller wrote a condition — and an unattributed clock is
          not comparable even with itself.
      reconciliation:
        type: map
        required: true
        doc: >-
          Where the object stands between what was asked of it and what has been observed (§37.5).
          A map rather than a word: `state` in §37.5's own phrasing, `rule` naming the derivation
          so a reader can look it up and disagree with it, `evidence` listing the fields that rule
          read and what they held, `stage` as far up §20.4's ladder as the evidence reaches, and
          `verified_convergence` — which is true for exactly one of the five states and never for
          `generation-observed-only`. That last key is §37.3 held literally: a matching
          `observedGeneration` is not health, and a renderer that wants one green word has to ask
          this question rather than treating "not failed" as success.
    default_view:
      columns: [name, condition_type, status, reason, observed_generation, generation, message]

  - id: io.github.godspeed-you.kubernetes.cluster/1
    name: KubernetesCluster
    summary: >-
      One provider instance: which cluster it reaches, whether it answers, and who it is to it.
    identity: [uid]
    fields:
      uid:
        type: string
        required: true
        doc: >-
          The provider instance — `kubernetes:<context>` (§6.2, §10.1). Not a `metadata.uid`:
          this record is not a Kubernetes object. It is the identity because it is what stays
          stable across reconnects and what two instances pointed at one cluster differ in.
          Keying on the cluster fingerprint instead would merge exactly the two instances §10.3
          says MUST NOT be merged.
      name:
        type: string
        required: true
        doc: 'The context this instance was configured from. A locator, never an identity (§16.2).'
      server:
        type: string
        nullable: true
        doc: >-
          The normalised API server origin — §10.2's first fingerprint signal, with the scheme's
          default port dropped so that two spellings of one address compare equal.
      reachable:
        type: bool
        required: true
        doc: >-
          Whether the API server answered anything at all. A `403` counts: a server that refuses
          is a server that is there, and the two have different fixes (§21.4).
      server_version:
        type: string
        nullable: true
        doc: >-
          `gitVersion` from `/version`, verbatim. Never interpreted: §5.3 forbids rejecting a
          cluster whose version string is unfamiliar. Null when `/version` did not answer, and
          `unknowns` then says why.
      tls:
        type: string
        required: true
        doc: >-
          What protects the session: `verified`, `insecure: certificate verification disabled`,
          or `none: plain HTTP/1.1`. §8.4 requires the active insecure state to be visible in
          provider diagnostics, so this is stated rather than inferred from the URL.
      fingerprint:
        type: string
        nullable: true
        doc: >-
          A non-secret digest over the fingerprint signals that were obtained (§10.2). Null when
          none were — a hash of nothing is a stable value every unidentifiable cluster would
          share. Two instances with the same fingerprint may be one cluster and are still two
          instances (§10.3).
      fingerprint_signals:
        type: list<string>
        required: true
        doc: >-
          Which of §10.2's signals the fingerprint above is composed of, so that one built from a
          single signal is visibly weaker than one built from three. Empty rather than null when
          nothing was obtainable: that is a known answer.
      kube_system_uid:
        type: string
        nullable: true
        doc: >-
          The `kube-system` namespace UID, the strongest identifier Kubernetes offers (§10.2).
          Null where the caller may not read it, and `unknowns` distinguishes a refusal from a
          namespace that is not there.
      server_key_fingerprint:
        type: string
        nullable: true
        doc: >-
          A SHA-256 over the server certificate's `SubjectPublicKeyInfo` (§10.2). The key rather
          than the certificate, so an ordinary renewal is not reported as a cluster replacement
          (§10.4). Null in this build, which does not surrender the verified certificate from its
          TLS session; `unknowns` records it as `not queried` rather than as absent.
      credential_identity:
        type: string
        nullable: true
        doc: >-
          The identity of the credential itself, before any impersonation (§8.5). Held apart from
          `effective_identity` even while nothing impersonates, so that the day one does, no
          reader of either field silently changes meaning.
      effective_identity:
        type: string
        nullable: true
        doc: >-
          The username the API server associates with this session's requests, from
          `SelfSubjectReview` (§8.6). Null where the cluster does not serve the review or refused
          it — which §8.6 requires never to block an ordinary read, so it is an unknown here and
          not an error.
      effective_uid:
        type: string
        nullable: true
        doc: 'The effective identity''s UID, where the authenticator provides one. Most do not.'
      effective_groups:
        type: list<string>
        nullable: true
        doc: >-
          The groups the API server resolved for this session. Null when the effective identity
          was not obtained; an empty list would claim membership of none.
      impersonating:
        type: bool
        required: true
        doc: >-
          Whether the session asks the API server to act as somebody else (§8.5). Always knowable
          locally, so never an unknown.
      impersonated_user:
        type: string
        nullable: true
        doc: 'The subject being impersonated, and null when none is (§8.5).'
      unknowns:
        type: list<string>
        required: true
        doc: >-
          Everything this diagnostic could not determine, each naming a subject and one of §21.4's
          outcomes — `read denied`, `not served`, `namespace absent`, `disconnected`,
          `not queried`. This is what makes a field the cluster refused distinguishable from one
          it does not have. Empty rather than null when everything was determined.
      probes:
        type: map
        required: true
        doc: >-
          Every request this diagnostic made, by source, with how it ended (§34.3). Per request
          rather than per cluster, so that an aggregated API server with its own availability is
          not reported as the cluster being unwell.
      latency_ms:
        type: map
        required: true
        doc: 'How long each request above took, in milliseconds (§34.3).'
    default_view:
      columns: [name, server, reachable, server_version, effective_identity, tls]

  # --- what a change would do, and what one attempt at it produced (§43 to §46, §56) ---------
  #
  # Two schemas that share their first nine fields, because a plan and an attempt at that plan
  # are aimed at the same thing in the same words: the object's identity, the two preconditions
  # of §56, the action and the fields it touches.
  #
  # **Identity is the four components ADR-0024 argues for**, not `uid` alone. A plan is not an
  # object: one object may have several prospective changes aimed at it, and keying them on the
  # object would collapse a scale-down and an image change into one record. The
  # `resource_version` in the key is the *precondition* — the point in the object's continuity
  # the change is aimed at — and never what came back.
  - id: io.github.godspeed-you.kubernetes.plan/1
    name: KubernetesChangePlan
    summary: >-
      A change described before it is made: its target, its preconditions, its effects and what
      could be verified afterwards.
    identity: [uid, resource_version, action, changes]
    fields:
      uid:
        type: string
        nullable: true
        doc: >-
          `metadata.uid` of the object the change is aimed at, which is also the UID precondition
          the mutation will assert (§16.1, §56.3). Null where the object carries none, in which
          case a deletion is refused rather than planned.
      name:
        type: string
        required: true
        doc: '`metadata.name` of that object. A locator, never an identity (§16.2).'
      namespace:
        type: string
        nullable: true
        doc: '`metadata.namespace` of that object, and null for a cluster-scoped one (§9.2).'
      api_version:
        type: string
        required: true
        doc: '`apiVersion` of that object.'
      kind:
        type: string
        required: true
        doc: '`kind` of that object, as the server spells it.'
      resource_version:
        type: string
        nullable: true
        doc: >-
          The `resourceVersion` the plan was built at, which is the optimistic-concurrency
          precondition the mutation will assert (§56.1). An opaque continuity token and never a
          clock (§14.3). Null where the object carried none, in which case an apply is refused
          rather than planned.
      action:
        type: string
        required: true
        doc: >-
          `apply` or `delete` — the two shapes every candidate action of §43.3 reduces to.
      changes:
        type: list<string>
        required: true
        doc: >-
          Each field the change touches, with what it holds now and what it would hold (§46.2).
          Empty for a deletion, which touches the whole object.
      preconditions:
        type: map
        required: true
        doc: >-
          What the mutation will assert about its target before the server carries it out (§56):
          the `resource_version`, the `uid`, and whether each of them actually guards anything —
          `guards_lost_update` and `guards_recreation`. A mutation with neither can land on an
          object recreated under the same name since the plan was made.
      precondition_guarded:
        type: bool
        required: true
        doc: >-
          Whether a precondition stands between this change and the wrong object. False only for
          the expert path of §43.4, which takes a reason and carries it as a caveat for the rest
          of the plan's life.
      propagation:
        type: string
        nullable: true
        doc: >-
          The propagation policy a deletion was planned with — `Foreground`, `Background` or
          `Orphan` (§45.2). Null for an apply, which removes nothing.
      effects:
        type: list<map>
        required: true
        doc: >-
          What the change is expected to do beyond the fields it names, each with its *own*
          `reversibility` (§46.2, §46.5). Prospective by construction: these are the effects a
          change of this shape has, not effects anybody observed.
      reversibility:
        type: string
        required: true
        doc: >-
          The weakest reversibility among the effects, never the commonest and never a boolean.
          §46.5 separates reapplying a previous spec from getting back what the change consumed,
          so a change with one irreversible effect is an irreversible change.
      recovery:
        type: map
        required: true
        doc: >-
          Two lists and a sentence: what reapplying the previous values would restore, what it
          would not, and why the first list is not a rollback (§46.5). "Recoverable" as one word
          is the claim that section forbids.
      dependents:
        type: list<map>
        required: true
        doc: >-
          The objects that name this one as an owner, on owner-reference evidence and nothing
          weaker (§24.1, §45.4). A preview assembled from label conventions would present a guess
          with the weight of a provider-proven edge (§23).
      dependent_coverage:
        type: string
        required: true
        doc: >-
          What the dependent preview covered and what it could not (§45.4, §21.4). It starts at
          "not queried", which is a different answer from "there are none".
      preflight:
        type: string
        required: true
        doc: >-
          Whether anybody asked the API server if this is allowed (§46.2). "not checked" is the
          default and is not a permission; the API server remains the authority either way
          (§21.1).
      verification:
        type: string
        required: true
        doc: >-
          How the outcome of this action could be verified afterwards, chosen from the action's
          semantics *before* the change rather than after it (§46.3). One of the answers is that
          this provider has no rule, which is a visible value rather than silent optimism.
      verification_stage:
        type: string
        nullable: true
        doc: >-
          The furthest rung of §20.4's ladder a confirmed verification of that rule would reach.
          Never "workload externally healthy": no API read establishes that (§37.5, Gate G).
      caveats:
        type: list<string>
        required: true
        doc: >-
          Everything true of this plan that the field list does not show: finalizers that must be
          removed, a dependent preview that saw nothing, admission effects nobody previewed,
          other field managers already on the object, a permission nobody verified.
      prediction:
        type: string
        required: true
        doc: >-
          Where this prediction comes from, which §21.4 of the generic provider contract requires
          a provider to label. A plan is *static provider metadata*: it is derived from the
          object as it was read and from this provider's own rules, and no server dry run was
          made — which is a much weaker claim than a dry run's, and saying so is the point.
      statement:
        type: string
        required: true
        doc: >-
          The whole plan as it would be shown to somebody deciding whether to say yes, ending
          with the sentence the rest of it exists for: none of this is evidence that anything
          happened (§4 invariant 18, §46.1).
    default_view:
      columns: [kind, name, action, changes, reversibility, verification]

  # What one attempt at a change produced. There is deliberately no `succeeded` field and no
  # `rolled_out` field: `acceptance` says what the API server did with the request, `stage` says
  # how far up §20.4's ladder that reaches — one rung for a write and none for a dry run — and
  # everything above it belongs to `verdict`, which has four values because §46.4 insists on the
  # fourth. Gate G is the absence of a field, and Gate H is `deletion_state` being a state rather
  # than a boolean.
  - id: io.github.godspeed-you.kubernetes.mutation/1
    name: KubernetesMutation
    summary: >-
      What one attempt at a change asked for, what the API server did with it, and the one rung
      of the ladder that establishes.
    identity: [uid, resource_version, action, changes]
    fields:
      uid:
        type: string
        nullable: true
        doc: '`metadata.uid` of the object the change was aimed at (§16.1, §56.3).'
      name:
        type: string
        required: true
        doc: '`metadata.name` of that object. A locator, never an identity (§16.2).'
      namespace:
        type: string
        nullable: true
        doc: '`metadata.namespace` of that object, and null for a cluster-scoped one (§9.2).'
      api_version:
        type: string
        required: true
        doc: '`apiVersion` of that object.'
      kind:
        type: string
        required: true
        doc: '`kind` of that object, as the server spells it.'
      resource_version:
        type: string
        nullable: true
        doc: >-
          The `resourceVersion` the attempt asserted as its precondition — what the object was at
          when it was read, never what came back (§56.1, §14.3).
      action:
        type: string
        required: true
        doc: '`apply` or `delete` (§43.3).'
      changes:
        type: list<string>
        required: true
        doc: >-
          Each field the attempt asked to change, with what it held and what it would hold.
      preconditions:
        type: map
        required: true
        doc: >-
          What the request asserted about its target, and whether each precondition actually
          guards anything (§56).
      acceptance:
        type: string
        required: true
        doc: >-
          What the API server did with the request: `persisted`, `dry run`, `conflict`,
          `precondition failed` or `refused`. None of the five is a word about what became of the
          cluster (§4 invariant 18).
      dry_run:
        type: bool
        required: true
        doc: >-
          Whether the server was asked to run admission and defaulting and write nothing (§44.5).
          True unless the invocation said otherwise, because a preview that needs no argument is
          the only kind that is actually the easy path.
      prediction:
        type: string
        nullable: true
        doc: >-
          Where the prediction came from, for a dry run: a provider-native dry run, which
          predicts API acceptance semantics and not what controllers do afterwards (§44.5, §21.4
          of the generic provider contract). Null for a write, which is an observation of what
          the server did rather than a prediction of anything.
      code:
        type: int
        required: true
        doc: 'The HTTP status the API server answered with.'
      stage:
        type: string
        nullable: true
        doc: >-
          The furthest rung of §20.4's ladder this answer establishes: "API accepted
          desired-state change" for a write, and null for everything else including a successful
          dry run, which persisted nothing. Gate G lives in this field being the only one that
          could carry such a claim and in it never carrying a higher one.
      field_manager:
        type: string
        required: true
        doc: >-
          The name server-side apply recorded field ownership under (§44.2), so a cluster
          administrator reading `managedFields` can tell Ono's changes from a controller's.
      forced:
        type: bool
        required: true
        doc: >-
          Whether ownership was taken from a conflicting manager (§44.4). True only where a
          reason was given: there is no `force` flag anywhere in this package.
      forced_because:
        type: string
        nullable: true
        doc: >-
          The reason forcing was chosen, kept whole because it is what a reviewer reads when
          asking why one apply was allowed to take another manager's field (§44.4).
      conflict_fields:
        type: list<string>
        nullable: true
        doc: >-
          The fields an apply could not take, as the API server named them (§44.3). Null where
          there was no conflict.
      conflict_managers:
        type: list<string>
        nullable: true
        doc: >-
          The managers that own them. This is the ownership evidence §44.3 requires a conflict to
          be surfaced with, and it is the reason a conflict reaches a person rather than a retry.
      resolution:
        type: string
        nullable: true
        doc: >-
          What resolving the conflict requires: an explicit choice between leaving the field to
          its owner and taking ownership with a stated reason. There is exactly one value,
          because a resolution vocabulary that offered "force" would put the forbidden answer one
          match arm away from being taken automatically (§44.3).
      admission_differences:
        type: list<string>
        nullable: true
        doc: >-
          What admission and defaulting did to the document on the way in — a mutating webhook
          rewriting an image registry, a default injected into a field nobody set (§44.6). The
          returned object crosses the redaction boundary before it is compared, so a rewritten
          Secret payload cannot appear here (§22, Gate I).
      deletion_state:
        type: string
        nullable: true
        doc: >-
          Where a deletion stands, in the words §45.1 keeps apart: accepted with nothing known
          about the object, terminating with deletion pending, or absent from the API. There is
          no value meaning "deleted", and only a read that established absence produces the third
          (Gate H).
      finalizers:
        type: list<string>
        nullable: true
        doc: >-
          The finalizers still holding a terminating object. §45.3 requires deletion completion
          to be stated as depending on their removal, and this is what it depends on.
      propagation:
        type: string
        nullable: true
        doc: 'The propagation policy the delete was sent with (§45.2). Null for an apply.'
      verification:
        type: string
        required: true
        doc: >-
          The rule the outcome would be verified by, taken from the plan rather than chosen
          afterwards: a rule picked to make a verification pass is not a verification (§46.3).
      verdict:
        type: string
        nullable: true
        doc: >-
          What one look at the target immediately afterwards established: `confirmed`, `refuted`,
          `pending` or `inconclusive`. Null where nothing was written, so there was nothing to
          verify. `inconclusive` is neither success nor failure, and it is the honest answer when
          a single immediate observation found nothing decisive (§46.4).
      verification_detail:
        type: string
        nullable: true
        doc: >-
          The evidence the verdict rests on, and — for an inconclusive one — the sentence §46.4
          requires: this is not evidence that the change failed, and not evidence that it
          succeeded.
      reconciliation:
        type: map
        nullable: true
        doc: >-
          Where the object stands between what was asked of it and what has been observed, with
          the rule that derived it and the fields that rule read (§37.5). `verified_convergence`
          is true for exactly one of the five states, because a matching `observedGeneration` is
          not a claim of health (§37.3).
      statement:
        type: string
        required: true
        doc: >-
          Everything the attempt amounts to, assembled from the sentences the domain layer wrote
          for it. For a write it says that acceptance is not evidence that the intended outcome
          occurred; for a deletion it says that effects outside the API server are unknown either
          way.
    default_view:
      columns: [kind, name, action, acceptance, stage, verdict]
