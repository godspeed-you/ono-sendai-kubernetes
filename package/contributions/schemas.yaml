        type: string
        nullable: true
        doc: >-
          `spec.serviceName` — the governing headless Service (§25.3). Taken from the field rather
          than from the set's own name, because the two match by convention often enough to be
          trusted and differ exactly where a cluster is unusual.
      current_revision:
        type: string
        nullable: true
        doc: '`status.currentRevision` — the controller revision the settled pods are on.'
      update_revision:
        type: string
        nullable: true
        doc: >-
          `status.updateRevision`. Different from `current_revision` means a rollout is in
          progress; equal means it is not.
      claim_templates:
        type: list<string>
        nullable: true
        doc: >-
          The names under `spec.volumeClaimTemplates`. Template *intent* and never a list of
          PersistentVolumeClaims that exist — §25.3 requires the two to stay distinguishable, and
          this field is on the intent side of that line. Null when the set declares none.
