# The two words this package contributes that change a cluster (spec §31.22, §31.68).
#
# Read before any of this package's code runs, so that `set k8s-resource`, its help page, its
# risk level and the capability it needs are answerable on a shell that has never loaded the
# package — and so that the operator's decision about the grant can be made before the first
# invocation rather than during it.
#
# **Why these are commands and everything else is a target.** A target contribution carries a
# name, a schema, a summary and an identity note. It has nowhere to state a risk and nowhere to
# state a capability, because everything a target answers is a read. A command contribution
# carries both, and the host checks the capability at every invocation before the package's code
# is reached at all. A mutation spelled as a target would therefore be a write with no declared
# risk, reachable through `get` — which is §21.2 of the generic provider contract lost at the one
# place it matters. ADR-0024.
#
# **The verbs are core's** (`docs/contracts/verbs.yaml`). §31.22 asks a package to reuse an
# existing verb wherever the semantics allow, and both do: `set` is "modify properties or
# configuration" and `remove` is "delete a resource or a membership", which are exactly §43.3's
# bounded field change and its deletion. A `k8s-apply` would have been the first word of the
# Kubernetes mini-shell §4 invariant 22 forbids.
#
# **And there are still only two.** §43.3's seven candidate actions — scale, set image, restart
# rollout, cordon/uncordon, label, annotate, delete — are *arguments* of these two verbs rather
# than words of their own. A package that grew one command per Kubernetes transition would be
# the mini-shell §35.1 forbids, growing by verb instead of by noun, and each new word would have
# had to declare the same risk and the same capability for the same change. ADR-0042.
#
# **The noun is the one `get k8s-resource` already reads.** One word for a kind, read by one verb
# and written by another. Nothing is reachable here that `get` could not already show, and a
# curated noun — `k8s-deployment` and the rest — is still the better *read* of the same object.
#
# **`network.connect` is the capability, and the manifest says why it is the only honest one.**
# The KUANG/11 families gate host services; there is none for "change state in the external
# system a provider fronts", and the near misses carry scope keys that belong to other domains.
#
# **Every invocation asks for a server dry run unless it is told otherwise.** `dry_run` defaults
# to true (§44.5), so the shortest sentence a user can write predicts rather than writes, and
# what comes back is labelled a provider-native dry run rather than an observation (§21.4 of the
# generic provider contract).
#
# **Options, declared beside each command** (`ADR-0587 (core)`). They used to be prose in this
# comment, because a `CommandContribution` had nowhere to carry them — which meant `dry_run`, the
# argument that decides whether a cluster changes, had no help line, no type and no default the
# host could apply. It has all three now, and the safe value is the shell's guarantee rather than
# each handler's memory. What they mean:
#
#   context, kubeconfig, host, port   which cluster, exactly as every target takes them
#   namespace                         the namespace the object is in (§7.5)
#   kind, group, version, resource    which resource, resolved against discovery (ADR-0010)
#   name                              the object. Required: a change is aimed at one object
#                                     resolved to a stable identity before it is made (§21.3 of
#                                     the generic provider contract)
#   dry_run                           default true. `false` writes
#   replicas, image, restart_rollout, `set k8s-resource` only: §43.3's curated transitions —
#   schedulable, label, annotation    scale, set image, restart rollout, cordon/uncordon, label,
#                                     annotate. Each reduces to the same bounded field change and
#                                     each carries its own effects and its own verification rule
#                                     (§46.2, §46.3). Exactly one per invocation: one plan
#                                     describes one action. ADR-0042
#   set                               `set k8s-resource` only, and §43.4's **low-level** path: a
#                                     mapping from a raw JSON pointer to the value the field
#                                     should hold. It is labelled as the escape hatch wherever a
#                                     user meets it — here, in `help`, and as a caveat on every
#                                     plan and record it produces
#   unset                             `set k8s-resource` only, §43.4 again: a pointer, or a list
#                                     of them, whose fields the apply gives up rather than sets
#                                     (§44.1)
#   field_manager                     `set k8s-resource` only: the name ownership is recorded
#                                     under, default `ono-sendai` (§44.2)
#   force_because                     `set k8s-resource` only: the reason ownership is taken from
#                                     a conflicting manager. There is deliberately no `force`
#                                     flag — forcing is a sentence somebody wrote, and a
#                                     conflict without one is an answer rather than a retry
#                                     (§44.3, §44.4)
#   propagation                       `remove k8s-resource` only: `Foreground`, `Background` or
#                                     `Orphan`, default `Background` (§45.2)
#
# There is deliberately **no `resource_version` and no `uid` option**. §56's preconditions come
# from the object that was read, and an option by which a caller could type one would let a
# change be aimed at an object nobody looked at — which is the failure the preconditions exist to
# prevent (ADR-0019).

commands:
  - id: io.github.godspeed-you.kubernetes.command.set-k8s-resource
    verb: set
    target: k8s-resource
    summary: "Change one Kubernetes object through a curated action — `--replicas` to scale, `--image` to set an image, `--restart_rollout`, `--schedulable` to cordon or uncordon a Node, `--label`, `--annotation` — or through the low-level `--set`/`--unset` JSON-pointer escape hatch. A server dry run unless `dry_run false` is given (specification sections 43.3, 43.4, 44)."
    output: stream<io.github.godspeed-you.kubernetes.mutation/1>
    capabilities: [network.connect]
    argument_mode: words
    risk: mutate
    examples:
      - "set k8s-resource --context prod --kind Deployment --name api --replicas 2"
      - "set k8s-resource --context prod --kind Deployment --name api --replicas 2 --dry_run false"
      - "set k8s-resource --context prod --kind Deployment --name api --image web=registry.example/web:1.4.0"
      - "set k8s-resource --context prod --kind Deployment --name api --restart_rollout true"
      - "set k8s-resource --context prod --kind Node --name node-7 --schedulable false"
      - "set k8s-resource --context prod --kind Deployment --name api --label tier=edge"
      - "set k8s-resource --context prod --kind Deployment --name api --set '{\"/spec/minReadySeconds\": 10}'"

    options:
      - name: context
        type: string
        doc: "A kubeconfig context: its server, default namespace, trust anchors and credential."
      - name: kubeconfig
        type: string
        doc: "Which kubeconfig file to read the context from. An absolute path; default `~/.kube/config`."
      - name: host
        type: string
        doc: "An explicit API server host instead of a context (specification section 7.3)."
      - name: port
        type: int
        doc: "The API server port, where `host` names one and the default 443 is wrong."
      - name: namespace
        type: string
        doc: "One namespace, beating the context's default (specification section 7.5)."
      - name: kind
        type: string
        doc: "The Kubernetes kind, e.g. `Widget`, resolved against the cluster's own discovery."
      - name: group
        type: string
        doc: "The API group, e.g. `example.io`. Written empty it names the core group; omitted it searches every group the server lists."
      - name: version
        type: string
        doc: "One served version instead of the group's preferred one (specification section 13.4)."
      - name: resource
        type: string
        doc: "The REST collection name, e.g. `widgets`, where the kind is ambiguous or unknown."
      - name: name
        type: string
        doc: "One object, read at its own endpoint rather than filtered out of the collection. A different request with different permissions (specification section 17.1)."
      - name: dry_run
        type: bool
        doc: "Ask the API server what it would do without doing it. Default true: the shortest sentence a user can write predicts (specification section 44.5)."
        default: "true"
      # Section 43.3's curated transitions, in the order that section lists them. Each is an
      # argument of the verb the shell already has: no new word, and therefore no first entry of
      # the Kubernetes mini-shell §4 invariant 22 and §35.1 forbid. ADR-0042.
      - name: replicas
        type: int
        doc: "Scale: how many replicas the workload should ask for. The curated form of `/spec/replicas` (specification section 43.3)."
      - name: image
        type: list<string>
        doc: "Set image: `<container>=<image>`, naming the container rather than its position in the list. Write it more than once for more than one container (specification section 43.3)."
        repeatable: true
      - name: restart_rollout
        type: bool
        doc: "Restart the rollout by marking the pod template as changed, which is what makes a controller roll its pods. Nothing is deleted (specification section 43.3)."
      - name: schedulable
        type: bool
        doc: "Cordon or uncordon a Node: `false` stops the scheduler placing new pods on it, `true` lets it again. Pods already running are neither stopped nor moved (specification section 43.3)."
      - name: label
        type: list<string>
        doc: "Label: `<key>=<value>`, or `<key>=` to remove the label. Write it more than once for more than one (specification sections 43.3, 14.5)."
        repeatable: true
      - name: annotation
        type: list<string>
        doc: "Annotate: `<key>=<value>`, or `<key>=` to remove the annotation. Write it more than once for more than one (specification sections 43.3, 14.5)."
        repeatable: true
      # Section 43.4's escape hatch, and it says which one it is in the line a user reads first.
      - name: set
        type: record
        doc: "LOW-LEVEL EXPERT PATH (specification section 43.4): a mapping from a raw JSON pointer to the value the field should hold, e.g. `{\"/spec/replicas\": 2}`. It names fields against a schema you are expected to know and no curated action vouches for what they mean together. Prefer `--replicas`, `--image`, `--restart_rollout`, `--schedulable`, `--label` or `--annotation`, which each carry their own effects and verification rule."
      - name: unset
        type: list<string>
        doc: "LOW-LEVEL EXPERT PATH (specification section 43.4): a pointer whose field this apply gives up rather than sets. Write it more than once for more than one (specification section 44.1)."
        repeatable: true
      - name: field_manager
        type: string
        doc: "The name field ownership is recorded under (specification section 44.2)."
        default: "ono-sendai"
      - name: force_because
        type: string
        doc: "The reason ownership is taken from a conflicting manager. There is deliberately no `force` flag: forcing is a sentence somebody wrote (specification section 44.4)."
  # `destructive` rather than `mutate`: §45.1 and §45.5 are a list of the ways a deletion reaches
  # things this provider cannot get back, and `risk_levels` in core's `capabilities.yaml` defines
  # `destructive` as exactly "may cause irreversible loss". The host applies its own confirmation
  # policy to that descriptor (§21.5 of the generic provider contract); this package prompts for
  # nothing of its own.
  - id: io.github.godspeed-you.kubernetes.command.remove-k8s-resource
    verb: remove
    target: k8s-resource
    summary: "Delete one Kubernetes object, as a server dry run unless `dry_run false` is given (specification section 45)."
    output: stream<io.github.godspeed-you.kubernetes.mutation/1>
    capabilities: [network.connect]
    argument_mode: words
    risk: destructive
    examples:
      - "remove k8s-resource --context prod --kind ConfigMap --name stale"
      - "remove k8s-resource --context prod --kind ConfigMap --name stale --dry_run false"

    options:
      - name: context
        type: string
        doc: "A kubeconfig context: its server, default namespace, trust anchors and credential."
      - name: kubeconfig
        type: string
        doc: "Which kubeconfig file to read the context from. An absolute path; default `~/.kube/config`."
      - name: host
        type: string
        doc: "An explicit API server host instead of a context (specification section 7.3)."
      - name: port
        type: int
        doc: "The API server port, where `host` names one and the default 443 is wrong."
      - name: namespace
        type: string
        doc: "One namespace, beating the context's default (specification section 7.5)."
      - name: kind
        type: string
        doc: "The Kubernetes kind, e.g. `Widget`, resolved against the cluster's own discovery."
      - name: group
        type: string
        doc: "The API group, e.g. `example.io`. Written empty it names the core group; omitted it searches every group the server lists."
      - name: version
        type: string
        doc: "One served version instead of the group's preferred one (specification section 13.4)."
      - name: resource
        type: string
        doc: "The REST collection name, e.g. `widgets`, where the kind is ambiguous or unknown."
      - name: name
        type: string
        doc: "One object, read at its own endpoint rather than filtered out of the collection. A different request with different permissions (specification section 17.1)."
      - name: dry_run
        type: bool
        doc: "Ask the API server what it would do without doing it. Default true: the shortest sentence a user can write predicts (specification section 44.5)."
        default: "true"
      - name: propagation
        type: string
        doc: "`Foreground` keeps the object until its dependents are gone, `Background` removes it now and collects them afterwards, `Orphan` leaves them behind owned by nothing."
        default: "Background"