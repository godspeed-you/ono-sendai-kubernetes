      - name: port
        type: int
        doc: "The API server port, where `host` names one and the default 443 is wrong."
      - name: namespace
        type: string
        doc: "One namespace, beating the context's default (specification section 7.5)."
      - name: all_namespaces
        type: bool
        doc: "Every namespace the caller can see. Deliberate rather than implied: there is no silent fan-out (specification section 9.4)."
      - name: kind
        type: string
        doc: "The Kubernetes kind, e.g. `Widget`, resolved against the cluster's own discovery."
      - name: group
        type: string
        doc: "The API group, e.g. `example.io`. Written empty it names the core group; omitted it searches every group the server lists."
      - name: version
        type: string
        doc: "One served version instead of the group's preferred one (specification section 13.4)."
      - name: resource
        type: string
        doc: "The REST collection name, e.g. `widgets`, where the kind is ambiguous or unknown."
      - name: name
        type: string
        doc: "One object, read at its own endpoint rather than filtered out of the collection. A different request with different permissions (specification section 17.1)."
  # What may be said about the state one object is in (§40). Options are the object's, plus
  # `within_ms` — how far apart two observations on one clock may be and still be reported as
  # correlated. The strongest thing a record carries is one of five claims, none of which says that
  # one thing brought about another, and `strongest_claim` travels on every record so that a reader
  # who sees one finding still sees the ceiling. §40.5's `insufficient evidence` is an answer.
  - name: k8s-why
    schema: io.github.godspeed-you.kubernetes.why/1
    summary: >-
      What can be said about the state an object is in — correlation, order, a dependency path or
      something Kubernetes asserts, and never a cause (specification section 40).
    identity_doc: >-
      Two observations are the same finding when the object, the claim and what the claim rests on
      all match. A finding has no `metadata.uid` of its own.

    options:
      - name: context
        type: string
        doc: "A kubeconfig context: its server, default namespace, trust anchors and credential."
      - name: kubeconfig
        type: string
        doc: "Which kubeconfig file to read the context from. An absolute path; default `~/.kube/config`."
      - name: host
        type: string
