  # What a change *would* do, before anything is changed (§46). A target rather than a command
  # because building a plan is read-only: one `GET` of the object the change is aimed at, plus
  # discovery, and this provider's own rules. Deliberately no server dry run on this path — a
  # dry-run `PATCH` is a write-shaped request that runs admission webhooks, and a word a user may
  # point at anything must not do that. The plan says so in its caveats instead, and the dry run
  # lives on `set k8s-resource`, where the risk is declared. Options: `kind`/`group`/`version`/
  # `resource` and `name` name the object exactly as `k8s-resource` does; `set` and `unset` state
  # the field change; `action delete` plans a deletion instead, with `propagation`. ADR-0024.
  - name: k8s-plan
    schema: io.github.godspeed-you.kubernetes.plan/1
    summary: "What a change would do, before anything is changed (specification section 46)."
    identity_doc: "Two records describe the same prospective change when the object lifetime, the `resourceVersion` the plan is aimed at, the action and the fields it touches all match. A plan has no `metadata.uid` of its own; the uid on the record is the target object's."

