# The nouns this package answers for, readable before any of its code runs (spec §31.68).
#
# The Tier 1 operational set of specification §15.2 — the resources everyday workload
# troubleshooting crosses. They are declared statically so that `get k8s-pod`, its help page and
# its completion answer on a shell that has never loaded this package, and so that the package
# loads on first use rather than on every start.
#
# **Every word here has a schema and a handler behind it.** ADR-0005 held fourteen of them back
# because a declared schema is a promise the package could not yet keep; `contributions/
# schemas.yaml` now declares all of them and `contributions::TARGETS` wires all of them, and
# `tests/contributions.rs` fails if the three ever disagree again.
#
# **Every noun below takes the same options, and this document has nowhere to say so.** A target
# contribution carries a `name`, a `schema`, a `summary` and an `identity_doc` and nothing else —
# `docs/contracts/kuang/contributions.v1.yaml` in core has no `options` key for a target, and the
# wire type is `deny_unknown_fields` — so the options are documented here and in each target's
# `summary` line rather than in a field a shell could complete:
#
#   context      a kubeconfig context; its server, namespace, trust anchors and credential
#   kubeconfig   which file to read it from, default `~/.kube/config`
#   host, port   an explicit endpoint instead of a context (§7.3), spoken as plain HTTP/1.1
#   namespace    one namespace, beating the context's default (§7.5)
#   all_namespaces  every namespace the caller can see, and never a silent fan-out (§9.4)
#   name         one object, read at its own REST endpoint rather than filtered out of the
#                collection (§17.1). A different request with different permissions, and its
#                `404` means the object is absent where a collection's means the API is not
#                served — ADR-0012
#   max_pages    a page budget (§18.4)
#   kind, group, version, resource   for `k8s-resource` only: which resource to read (ADR-0010)
#
# The `k8s-` prefix is deliberate. `pod` and `node` are reserved in core's `docs/contracts/
# targets.yaml` as provider-qualified words with no schema yet, and claiming them from a package
# would decide a question that belongs to core. A prefixed noun is honest about who answers it
# and costs a reader four characters.
#
# `k8s-resource` is how a custom resource becomes typeable, and it is the last entry rather than
# the first because it is the floor rather than the headline. A CRD invented after this package
# was built cannot appear in a document written before it — the tension between §31.68's static
# placeholders and §33.1's dynamic CRDs — so the noun names the *shape of the question* instead of
# the answer: `get k8s-resource --kind Widget --group example.io`. One word this document can
# carry, reaching every kind discovery can find, at the cost of a more verbose spelling than a
# curated noun. A curated noun above is then a better answer for a kind rather than the only
# answer for it. ADR-0010 records why this rather than a target contributed at handshake time.

targets:
  - name: k8s-namespace
    schema: io.github.godspeed-you.kubernetes.namespace/1
    summary: "Namespaces, the primary scope dimension of a cluster."
    identity_doc: "Two observations are the same namespace when their `metadata.uid` matches."
  - name: k8s-node
    schema: io.github.godspeed-you.kubernetes.node/1
    summary: "Nodes, and the cloud instances underneath them."
    identity_doc: "Two observations are the same node when their `metadata.uid` matches; a name reused after deletion is a new node."
  - name: k8s-pod
    schema: io.github.godspeed-you.kubernetes.pod/1
    summary: "Pods, the workload that actually runs."
    identity_doc: "Two observations are the same pod when their `metadata.uid` matches. A recreated pod with the same name is a different pod."
  - name: k8s-deployment
    schema: io.github.godspeed-you.kubernetes.deployment/1
    summary: "Deployments, and the ReplicaSets they control."
    identity_doc: "Two observations are the same deployment when their `metadata.uid` matches."
  - name: k8s-replicaset
    schema: io.github.godspeed-you.kubernetes.replicaset/1
    summary: "ReplicaSets, which sit between a Deployment and its Pods."
    identity_doc: "Two observations are the same ReplicaSet when their `metadata.uid` matches."
  - name: k8s-statefulset
    schema: io.github.godspeed-you.kubernetes.statefulset/1
    summary: "StatefulSets, and the claims their templates materialise."
    identity_doc: "Two observations are the same StatefulSet when their `metadata.uid` matches."
  - name: k8s-daemonset
    schema: io.github.godspeed-you.kubernetes.daemonset/1
    summary: "DaemonSets, and their rollout across nodes."
    identity_doc: "Two observations are the same DaemonSet when their `metadata.uid` matches."
  - name: k8s-service
    schema: io.github.godspeed-you.kubernetes.service/1
    summary: "Services, and the Pods their selectors reach."
    identity_doc: "Two observations are the same service when their `metadata.uid` matches."
  - name: k8s-endpointslice
    schema: io.github.godspeed-you.kubernetes.endpointslice/1
    summary: "EndpointSlices, the endpoints a Service is represented by."
    identity_doc: "Two observations are the same slice when their `metadata.uid` matches."
  - name: k8s-ingress
    schema: io.github.godspeed-you.kubernetes.ingress/1
    summary: "Ingresses, and the Services they route to."
    identity_doc: "Two observations are the same ingress when their `metadata.uid` matches."
  - name: k8s-job
    schema: io.github.godspeed-you.kubernetes.job/1
    summary: "Jobs, and the Pods they own."
    identity_doc: "Two observations are the same job when their `metadata.uid` matches."
  - name: k8s-cronjob
    schema: io.github.godspeed-you.kubernetes.cronjob/1
    summary: "CronJobs, and the Jobs they create."
    identity_doc: "Two observations are the same CronJob when their `metadata.uid` matches."
  - name: k8s-configmap
    schema: io.github.godspeed-you.kubernetes.configmap/1
    summary: "ConfigMaps, and what consumes them."
    identity_doc: "Two observations are the same ConfigMap when their `metadata.uid` matches."
  - name: k8s-secret
    schema: io.github.godspeed-you.kubernetes.secret/1
    summary: "Secret metadata — which keys exist and what mounts them, never the values (specification section 22)."
    identity_doc: "Two observations are the same secret when their `metadata.uid` matches."
  - name: k8s-serviceaccount
    schema: io.github.godspeed-you.kubernetes.serviceaccount/1
    summary: "ServiceAccounts, the identity a workload runs as."
    identity_doc: "Two observations are the same account when their `metadata.uid` matches."
  - name: k8s-persistentvolumeclaim
    schema: io.github.godspeed-you.kubernetes.persistentvolumeclaim/1
    summary: "PersistentVolumeClaims, and the volumes they bind."
    identity_doc: "Two observations are the same claim when their `metadata.uid` matches."
  - name: k8s-persistentvolume
    schema: io.github.godspeed-you.kubernetes.persistentvolume/1
    summary: "PersistentVolumes, and the storage behind them."
    identity_doc: "Two observations are the same volume when their `metadata.uid` matches."
  - name: k8s-storageclass
    schema: io.github.godspeed-you.kubernetes.storageclass/1
    summary: "StorageClasses, and what they provision."
    identity_doc: "Two observations are the same class when their `metadata.uid` matches."
  - name: k8s-networkpolicy
    schema: io.github.godspeed-you.kubernetes.networkpolicy/1
    summary: "NetworkPolicies, and the Pods their selectors govern."
    identity_doc: "Two observations are the same policy when their `metadata.uid` matches."

  - name: k8s-resource
    schema: io.github.godspeed-you.kubernetes.resource/1
    summary: "Any resource this cluster serves, named by `kind` and `group` (specification section 15.1)."
    identity_doc: "Two observations are the same object when their `metadata.uid` matches, whatever kind they are."

  # What one object is related to. Not a resource: an edge has no `metadata.uid` and no collection
  # to be fetched from, so this noun names an object with `kind` and `name` and answers one record
  # per edge — with the evidence class and the fields that decided it, which is Gate D (§62.4).
  # `relation` narrows to one of §35.7's words. ADR-0014.
  - name: k8s-relation
    schema: io.github.godspeed-you.kubernetes.relation/1
    summary: "What one object is related to, with the evidence class and the fields that decided each edge (specification sections 23 to 32)."
    identity_doc: "Two observations are the same edge when the object they start at, the relationship word, the far end's address and the field that decided all match. An edge has no `metadata.uid` of its own."

  # What changed in a collection while this provider was watching it, and — the point of the
  # exercise — every period it could not observe. §19.1's list-then-watch is one sequence, so this
  # noun acquires the collection itself rather than reading one somebody else listed. It is a
  # *live* watch: a record is emitted as each change arrives and the invocation runs until it is
  # cancelled (§41, ADR-0023). Options: `kind`/`group`/`version`/`resource` name the collection
  # exactly as `k8s-resource` does, `max_changes` bounds the answer to that many records for a
  # caller that wants a prefix rather than a stream, and `reacquire` (default true) decides
  # whether a broken stream is re-listed on the other side of its gap. The gap record is emitted
  # either way.
  - name: k8s-change
    schema: io.github.godspeed-you.kubernetes.change/1
    summary: "What changed in a collection while this provider was watching it, and every period it could not observe (specification section 19)."
    identity_doc: "Two observations are the same change when the collection, the observation period, the word, the object's UID and its resourceVersion all match. A change has no `metadata.uid` of its own; the UID on the record is the object's."

  # The Events a cluster reported about one object (§38). Not a collection of the query's kind: the
  # query names the object the Events are *about*, and the Events themselves come from whichever of
  # §38.2's two representations the cluster serves. Options: `kind`/`group`/`version`/`resource` and
  # `name` name the object, exactly as `k8s-relation` names one.
  #
  # An aggregated Event is **one** record carrying its count, and a search that matched nothing ends
  # the invocation stating §38.6 rather than completing with an empty stream — an empty stream is
  # read as absence, and the absence of an Event never proves that nothing happened. ADR-0025.
  - name: k8s-event
    schema: io.github.godspeed-you.kubernetes.event/1
    summary: >-
      The Events a cluster reported about an object — best-effort, briefly retained, and never a
      history (specification section 38).
    identity_doc: >-
      Two observations are the same Event when their `metadata.uid` matches. An Event is an object
      of its own; what it regards is a field of it. An aggregated Event is one Event however many
      occurrences it counts.

  # What a Node states about the machine underneath it, exported for someone else to resolve (§28.3
  # to §28.5, §47). The kind is fixed — the pointers and the published keys are a Node's — so the
  # only option beyond the endpoint ones is `name`. Nothing here presents a match: each record
  # carries the value, the pointer it was read at, its evidence class and its strength, and there is
  # no field for a foreign resource. A key that could not be read is a record too, with `observed`
  # false and an outcome from §21.4's vocabulary. ADR-0016.
  - name: k8s-evidence
    schema: io.github.godspeed-you.kubernetes.evidence/1
    summary: >-
      What a Node states about the machine underneath it, as inspectable evidence for a resolver
      that has read the other system (specification section 47).
    identity_doc: >-
      Two observations are the same evidence when the Node's `metadata.uid`, the published key and
      the field pointer all match. A Node rebuilt under the same name is a different machine.

  # One container's log, as lines (§42.1). Options: `name` is the Pod, `container` names one where
  # the Pod has several, `previous` reads the one prior run the kubelet retains, `timestamps` asks
  # the server to prefix each line, and `tail_lines`, `since_seconds` and `limit_bytes` bound the
  # answer — each of them adding an entry to every record's `bounds`. `bounds` is never empty, and
  # that is the point: a retrieved log is not the container's output. There is deliberately no
  # `follow`, which is a live stream and would need `k8s-change`'s machinery to answer honestly.
  - name: k8s-log
    schema: io.github.godspeed-you.kubernetes.log/1
    summary: >-
      A container's log, as lines that state their bounds — never the container's complete output
      (specification section 42.1).
    identity_doc: >-
      Two observations are the same line when the Pod's `metadata.uid`, the container, the run and
      the ordinal within the read all match. A line has no identity of its own; a process that
      printed one message twice printed it twice.

  # What is known to have happened to one object, and by whose clock (§39). Options are the object's:
  # `kind`/`group`/`version`/`resource` and `name`. Every record carries the window this provider
  # observed in, on its own clock, and both kinds of hole in it — the stretches nobody observed and
  # the scopes nobody could read. Every observation this route produces is `reported` rather than
  # `observed`, because nothing here opens a watch and only a watch witnesses a change (§39.2).
  - name: k8s-timeline
    schema: io.github.godspeed-you.kubernetes.timeline/1
    summary: >-
      What is known to have happened to an object, with the clock behind every time and the
      periods nobody observed (specification section 39).
    identity_doc: >-
      Two observations are the same observation when the object, the source, the clock, the raw
      timestamp and what was observed all match. Two observations on two clocks are never in an
      order.

  # What may be said about the state one object is in (§40). Options are the object's, plus
  # `within_ms` — how far apart two observations on one clock may be and still be reported as
  # correlated. The strongest thing a record carries is one of five claims, none of which says that
  # one thing brought about another, and `strongest_claim` travels on every record so that a reader
  # who sees one finding still sees the ceiling. §40.5's `insufficient evidence` is an answer.
  - name: k8s-why
    schema: io.github.godspeed-you.kubernetes.why/1
    summary: >-
      What can be said about the state an object is in — correlation, order, a dependency path or
      something Kubernetes asserts, and never a cause (specification section 40).
    identity_doc: >-
      Two observations are the same finding when the object, the claim and what the claim rests on
      all match. A finding has no `metadata.uid` of its own.

  # The structured observations an object's controllers wrote about it (§37.1). Options are the
  # object's. One record per condition, because a Deployment can be `Available=True` on its old
  # replicas while `Progressing=False` because the new ones never came up. `observedGeneration`
  # arrives as a number; the only derived state is the `reconciliation` map, whose
  # `verified_convergence` key is false for a matching generation alone (§37.3, §37.5).
  - name: k8s-condition
    schema: io.github.godspeed-you.kubernetes.condition/1
    summary: >-
      The conditions an object's controllers wrote about it, each with the generation it was
      written about (specification section 37).
    identity_doc: >-
      Two observations are the same condition when the object's `metadata.uid` and the condition
      `type` match. A condition that flipped is the same condition.

  # The provider instance itself rather than anything in the cluster: which cluster this is,
  # whether it answers, and who you are to it (§8.5, §8.6, §10, §34.3). It is the one target here
  # that is useful when the cluster is *not* reachable, which is why an unreachable API server
  # gives it a record saying so rather than a failed invocation.
  - name: k8s-cluster
    schema: io.github.godspeed-you.kubernetes.cluster/1
    summary: "Which cluster this is, whether it can be reached, and who you are to it."
    identity_doc: "Two observations are the same provider instance when their `uid` — `kubernetes:<context>` — matches. Two instances that reach one cluster share a fingerprint and are never one instance (specification section 10.3)."

  # What a change *would* do, before anything is changed (§46). A target rather than a command
  # because building a plan is read-only: one `GET` of the object the change is aimed at, plus
  # discovery, and this provider's own rules. Deliberately no server dry run on this path — a
  # dry-run `PATCH` is a write-shaped request that runs admission webhooks, and a word a user may
  # point at anything must not do that. The plan says so in its caveats instead, and the dry run
  # lives on `set k8s-resource`, where the risk is declared. Options: `kind`/`group`/`version`/
  # `resource` and `name` name the object exactly as `k8s-resource` does; `set` and `unset` state
  # the field change; `action delete` plans a deletion instead, with `propagation`. ADR-0024.
  - name: k8s-plan
    schema: io.github.godspeed-you.kubernetes.plan/1
    summary: "What a change would do, before anything is changed (specification section 46)."
    identity_doc: "Two records describe the same prospective change when the object lifetime, the `resourceVersion` the plan is aimed at, the action and the fields it touches all match. A plan has no `metadata.uid` of its own; the uid on the record is the target object's."
