  # One container's log, as lines (§42.1). Options: `name` is the Pod, `container` names one where
  # the Pod has several, `previous` reads the one prior run the kubelet retains, `timestamps` asks
  # the server to prefix each line, and `tail_lines`, `since_seconds` and `limit_bytes` bound the
  # answer — each of them adding an entry to every record's `bounds`. `bounds` is never empty, and
  # that is the point: a retrieved log is not the container's output. `follow` keeps the body open
  # and answers with each line as it arrives, on `k8s-change`'s machinery: the invocation is live,
  # nothing is accumulated, and the operator ends it. It is refused with `previous`, because the
  # server answers that pair by closing at once and a caller reads that as a container that just
  # stopped (ADR-0030).
  - name: k8s-log
    schema: io.github.godspeed-you.kubernetes.log/1
    summary: >-
      A container's log, as lines that state their bounds — never the container's complete output
      (specification section 42.1).
    identity_doc: >-
      Two observations are the same line when the Pod's `metadata.uid`, the container, the run and
      the ordinal within the read all match. A line has no identity of its own; a process that
      printed one message twice printed it twice.
    answer: unbounded

    options:
      - name: context
        type: string
        doc: "A kubeconfig context: its server, default namespace, trust anchors and credential."
      - name: kubeconfig
        type: string
        doc: "Which kubeconfig file to read the context from. An absolute path; default `~/.kube/config`."
      - name: host
        type: string
        doc: "An explicit API server host instead of a context (specification section 7.3)."
      - name: port
        type: int
        doc: "The API server port, where `host` names one and the default 443 is wrong."
      - name: namespace
        type: string
        doc: "One namespace, beating the context's default (specification section 7.5)."
      - name: name
        type: string
        doc: "One object, read at its own endpoint rather than filtered out of the collection. A different request with different permissions (specification section 17.1)."
      - name: container
        type: string
        doc: "Which container's log, where the Pod has more than one."
      - name: previous
        type: bool
        doc: "The previous instance of the container, where one is retained."
      - name: timestamps
        type: bool
        doc: "Ask the API server to prefix each line with the time it wrote it."
      - name: tail_lines
        type: int
        doc: "Read only the last N lines, which is a bound on the read and is reported as one."
      - name: since_seconds
        type: int
        doc: "Read only what was written in the last N seconds."
      - name: limit_bytes
        type: int
        doc: "Stop after N bytes. The stop is coverage, never a silently short log."
      - name: follow
        type: bool
        doc: "Keep the body open and answer with each line as the container writes it, until the query is cancelled. Refused with `previous`: a run that has already ended cannot produce another line."
  # What is known to have happened to one object, and by whose clock (§39). Options are the object's:
  # `kind`/`group`/`version`/`resource` and `name`. Every record carries the window this provider
  # observed in, on its own clock, and both kinds of hole in it — the stretches nobody observed and
  # the scopes nobody could read. Every observation this route produces is `reported` rather than
  # `observed`, because nothing here opens a watch and only a watch witnesses a change (§39.2).
  - name: k8s-timeline
    schema: io.github.godspeed-you.kubernetes.timeline/1
    summary: >-
      What is known to have happened to an object, with the clock behind every time and the
      periods nobody observed (specification section 39).
    identity_doc: >-
      Two observations are the same observation when the object, the source, the clock, the raw
      timestamp and what was observed all match. Two observations on two clocks are never in an
      order.

    options: &one-object-of-a-discovered-kind
