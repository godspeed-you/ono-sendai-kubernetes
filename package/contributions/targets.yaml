# The nouns this package answers for, readable before any of its code runs (spec §31.68).
#
# The Tier 1 operational set of specification §15.2 — the resources everyday workload
# troubleshooting crosses. They are declared statically so that `get k8s-pod`, its help page and
# its completion answer on a shell that has never loaded this package, and so that the package
# loads on first use rather than on every start.
#
# **Every word here has a schema and a handler behind it.** ADR-0005 held fourteen of them back
# because a declared schema is a promise the package could not yet keep; `contributions/
# schemas.yaml` now declares all of them and `contributions::TARGETS` wires all of them, and
# `tests/contributions.rs` fails if the three ever disagree again.
#
# **Every noun below declares the arguments it takes**, in the `options:` list beside its schema
# (`ADR-0587 (core)`). Until that change a target contribution carried a `name`, a `schema`, a
# `summary` and an `identity_doc` and nothing else, so these words were prose in this comment and
# a shell could complete none of them. They are now the same declaration a core command makes, so
# `help get k8s-pod` prints them and `get k8s-pod --con<TAB>` completes — before this package has
# ever been loaded, from this document alone (spec §31.68).
#
# What they mean:
#
#   context      a kubeconfig context; its server, namespace, trust anchors and credential
#   kubeconfig   which file to read it from, default `~/.kube/config`
#   host, port   an explicit endpoint instead of a context (§7.3), spoken as plain HTTP/1.1
#   namespace    one namespace, beating the context's default (§7.5)
#   all_namespaces  every namespace the caller can see, and never a silent fan-out (§9.4)
#   name         one object, read at its own REST endpoint rather than filtered out of the
#                collection (§17.1). A different request with different permissions, and its
#                `404` means the object is absent where a collection's means the API is not
#                served — ADR-0012
#   selector, field_selector   Kubernetes selectors, pushed to the API server exactly as written
#                (§17.3, §17.4) — there is no translation, so there is nothing for a translation
#                to change. A field selector this server will not index is refused by name, never
#                answered with an empty collection (§17.5). ADR-0049
#   max_pages    a page budget: a decision to stop consuming, which §18.4 says is not
#                incompleteness — the records say more exists upstream and the answer completes
#   max_requests, max_scopes, budget_ms   what one query may spend (§49.5), over the conservative
#                defaults of §50.1. Passing one of these is the *provider* stopping short, which
#                is a coverage gap and not a decision
#   kind, group, version, resource   for the nouns that take their kind from the query rather
#                than from the table: which resource to read (ADR-0010)
#
# **`namespace` is declared on every kind, including the cluster-scoped ones.** Whether a resource
# is namespaced is discovery's answer and never a compile-time one (§4 invariants 1–2, §9.2), so
# this document does not carry a list of which kinds have a namespace — it would be exactly the
# static model of Kubernetes §5.2 forbids. A namespace named for a cluster-scoped kind produces no
# namespace segment in the request, and the record says which scope it was read in.
#
# The `k8s-` prefix is deliberate. `pod` and `node` are reserved in core's `docs/contracts/
# targets.yaml` as provider-qualified words with no schema yet, and claiming them from a package
# would decide a question that belongs to core. A prefixed noun is honest about who answers it
# and costs a reader four characters.
#
# `k8s-resource` is how a custom resource becomes typeable, and it is the last entry rather than
# the first because it is the floor rather than the headline. A CRD invented after this package
# was built cannot appear in a document written before it — the tension between §31.68's static
# placeholders and §33.1's dynamic CRDs — so the noun names the *shape of the question* instead of
# the answer: `get k8s-resource --kind Widget --group example.io`. One word this document can
# carry, reaching every kind discovery can find, at the cost of a more verbose spelling than a
# curated noun. A curated noun above is then a better answer for a kind rather than the only
# answer for it. ADR-0010 records why this rather than a target contributed at handshake time.

targets:
  - name: k8s-namespace
    schema: io.github.godspeed-you.kubernetes.namespace/1
    summary: "Namespaces, the primary scope dimension of a cluster."
    identity_doc: "Two observations are the same namespace when their `metadata.uid` matches."
    options: &curated-kind
      - name: context
        type: string
        doc: "A kubeconfig context: its server, default namespace, trust anchors and credential."
      - name: kubeconfig
        type: string
        doc: "Which kubeconfig file to read the context from. An absolute path; default `~/.kube/config`."
      - name: host
        type: string
        doc: "An explicit API server host instead of a context (specification section 7.3)."
      - name: port
        type: int
        doc: "The API server port, where `host` names one and the default 443 is wrong."
      - name: namespace
        type: string
        doc: "One namespace, beating the context's default (specification section 7.5)."
      - name: all_namespaces
        type: bool
        doc: "Every namespace the caller can see. Deliberate rather than implied: there is no silent fan-out (specification section 9.4)."
      - name: name
        type: string
        doc: "One object, read at its own endpoint rather than filtered out of the collection. A different request with different permissions (specification section 17.1)."
      - name: selector
        type: string
        doc: "A Kubernetes label selector, e.g. `app=api,tier!=cache` or `env in (staging, prod)`. Pushed to the API server verbatim, so the semantics are Kubernetes' own (specification section 17.4)."
      - name: field_selector
        type: string
        doc: "A Kubernetes field selector, e.g. `status.phase=Running`. Support varies by resource and by server; one this server will not index is refused by name rather than answered with an empty collection (specification section 17.5)."
      - name: max_pages
        type: int
        doc: "How many pages of a listing to read before stopping. The stop is coverage, never a silently short answer (specification section 18.4)."
      - name: max_requests
        type: int
        doc: "How many requests this query may send to the API server before it stops and says so. Default 64, which is what an interactive question costs (specification section 49.5)."
      - name: max_scopes
        type: int
        doc: "How many distinct scopes — namespaces, API group-versions — the query may reach into. Checked against the estimated breadth before the first request rather than halfway through (specification section 17.6). Default 32."
      - name: budget_ms
        type: int
        doc: "How long the query may take before it stops with what it has. Default 10000: an interactive answer is one somebody is waiting for (specification section 50.1)."
