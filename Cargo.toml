[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/godspeed-you/ono-sendai-kubernetes"
authors = ["The Ono-Sendai project"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
base64 = "0.22"

[profile.dev]
# Line tables keep test backtraces readable at a fraction of full debuginfo's disk cost.
debug = "line-tables-only"
