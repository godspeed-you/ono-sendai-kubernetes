[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/godspeed-you/ono-sendai-kubernetes"
authors = ["The Ono-Sendai project"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
base64 = "0.22"

# The same TLS stack the shell uses (core's ADR-0353), with the `ring` provider. A provider that
# introduced a second TLS implementation into the tree it plugs into would widen the supply chain
# for no gain. §8.4's validation is this package's obligation, because the host brokers bytes and
# not requests (core ADR-0573, and ADR-0002 here).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pemfile = "2"
# The hash behind the cluster fingerprint of specification §10.2. `ring` rather than a second
# digest crate because `rustls` above is already built on it: one supply chain, not two.
ring = "0.17"
webpki-roots = "0.26"

# What a KUANG/11 package is written against. A git dependency because the SDK is not published.
#
# A **revision** rather than a branch, and the revision is deliberate: `ADR-0586` in core — a
# package answers more than one invocation at a time — is what §62.10's word "concurrently" needs,
# and it is on core's `implementation` branch rather than on `main`. Tracking `main` would silently
# undo this provider's concurrency the moment the lock file were regenerated, and tracking
# `implementation` would let a disposable branch decide what this repository builds against. So the
# reference names the commit that carries the change, and moves when somebody moves it on purpose.
# All four crates come from one revision: they share `ono-kuang-protocol`, and two revisions of it
# in one tree are two incompatible copies of every type that crosses the boundary.
ono-kuang-sdk = { git = "https://github.com/godspeed-you/ono-sendai", rev = "29edac758293c564816b7514765236a8ee360740" }
ono-kuang-protocol = { git = "https://github.com/godspeed-you/ono-sendai", rev = "29edac758293c564816b7514765236a8ee360740" }
ono-value = { git = "https://github.com/godspeed-you/ono-sendai", rev = "29edac758293c564816b7514765236a8ee360740" }

[profile.dev]
# Line tables keep test backtraces readable at a fraction of full debuginfo's disk cost.
debug = "line-tables-only"
